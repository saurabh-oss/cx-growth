name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The engine has no dependencies: the tests need neither a server nor a network.
      - name: Engine tests
        run: python -m unittest discover -s tests -v
      - name: The application imports
        run: |
          python -m pip install -r requirements.txt --quiet
          python -c "import sys; sys.path.insert(0, 'backend'); import main; print(len(main.app.routes), 'routes')"
