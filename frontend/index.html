              className="flex-1 text-[13.5px] px-3 py-2 rounded-md"
              style={{border:'1px solid var(--border-strong)',background:'var(--surface-2)',color:'var(--text)',fontFamily:'inherit',outline:'none'}}/>
            <button onClick={()=>ask()} disabled={busy||!q.trim()}
              className="px-4 py-2 rounded-md text-[13px] font-bold text-white"
              style={{background:COLORS.accent,opacity:(busy||!q.trim())?0.5:1}}>{busy?'…':'Ask'}</button>
          </div>
          <div className="flex flex-wrap gap-1 mb-4">
            {examples.map(x=>(
              <button key={x} onClick={()=>ask(x)} className="text-[11px] px-2 py-1 rounded"
                style={{background:'var(--surface-3)',color:'var(--text-2)'}}>{x}</button>
            ))}
          </div>

          {res&&res.resolved&&(
            <div className="rounded-md p-3.5 slide-in-u" style={{background:SOFT.green,border:'1px solid #b7e2c8'}}>
              <div className="flex items-center justify-between gap-2 mb-1.5">
                <span className="text-[11px] font-bold uppercase tracking-wider" style={{color:COLORS.green}}>✓ Resolved without an agent</span>
                <span className="mono text-[10.5px]" style={{color:COLORS.green}}>confidence {res.confidence.toFixed(2)}</span>
              </div>
              <p className="text-[13.5px] t-primary leading-relaxed">{res.answer}</p>
              <div className="mono text-[10.5px] mt-2" style={{color:COLORS.green}}>{res.source.id} · {res.source.title}</div>
            </div>
          )}
          {res&&!res.resolved&&(
            <div className="rounded-md p-3.5 slide-in-u" style={{background:SOFT.accent,border:'1px solid #bcd7fb'}}>
              <div className="flex items-center justify-between gap-2 mb-1.5">
                <span className="text-[11px] font-bold uppercase tracking-wider" style={{color:COLORS.accent}}>↗ Handed to an agent</span>
                <span className="mono text-[10.5px]" style={{color:COLORS.accent}}>confidence {res.confidence.toFixed(2)}</span>
              </div>
              <p className="text-[13px] t-primary leading-relaxed">{res.handoff.reason}.</p>
              {res.routing&&(
                <div className="grid grid-cols-2 gap-3 mt-2.5 pt-2.5" style={{borderTop:'1px dashed #bcd7fb'}}>
                  <div>
                    <div className="text-[10px] t-muted uppercase tracking-wide font-bold">Captured intent</div>
                    <div className="mono text-[11.5px] t-primary">{res.routing.intent}</div>
                  </div>
                  <div>
                    <div className="text-[10px] t-muted uppercase tracking-wide font-bold">Queue</div>
                    <div className="mono text-[11.5px] t-primary">{res.routing.queue}</div>
                  </div>
                </div>
              )}
              {res.handoff.carries&&(
                <div className="mt-2.5">
                  <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-0.5">The agent starts with</div>
                  {res.handoff.carries.map(x=><div key={x} className="text-[11.5px] t-secondary">• {x}</div>)}
                </div>
              )}
            </div>
          )}
          {res&&res.articles.length>0&&(
            <div className="mt-3">
              <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1">Articles considered · BM25 ranking</div>
              {res.articles.map(ar=>(
                <div key={ar.id} className="flex items-center gap-2 py-1" style={{borderBottom:'1px dashed var(--border)'}}>
                  <span className="mono text-[10.5px] font-bold t-secondary w-[58px] shrink-0">{ar.id}</span>
                  <span className="text-[11.5px] t-primary flex-1 truncate">{ar.title}</span>
                  <span className="text-[10px] t-muted">{ar.self_service?'self-service':'needs agent'}</span>
                  <span className="mono text-[10.5px] t-muted w-[36px] text-right">{ar.score.toFixed(1)}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>

      <div className="col-span-5 card">
        <div className="panel-head">
          <span className="panel-title">The cost side</span>
          <span className="ml-auto text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded"
            style={{background:SOFT.amber,color:COLORS.amber}}>Modelled</span>
        </div>
        {d?(
          <div className="p-4">
            <div className="grid grid-cols-2 gap-2.5 mb-3.5">
              {[['Answerable from knowledge',d.contacts_day.toLocaleString()+' / day',pct(d.share)+' of contacts'],
                ['Contained at '+pct(d.containment),d.contained_day.toLocaleString()+' / day','never reach an agent'],
              ].map(([l,v,n])=>(
                <div key={l} className="card-2 px-3 py-2.5">
                  <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1">{l}</div>
                  <div className="text-[16px] font-extrabold t-primary leading-none">{v}</div>
                  <div className="text-[10.5px] t-muted mt-1">{n}</div>
                </div>
              ))}
            </div>
            <div className="rounded-lg px-4 py-3 mb-3.5" style={{background:SOFT.green,border:'1px solid #b7e2c8'}}>
              <div className="text-[10px] uppercase tracking-wide font-bold mb-1" style={{color:COLORS.green}}>Cost avoided</div>
              <div className="text-[24px] font-extrabold leading-none" style={{color:COLORS.green}}>{money(d.saving_year)}</div>
              <div className="text-[11px] mt-1" style={{color:COLORS.green,opacity:.8}}>
                a year, at ${d.cost_per_contact.toFixed(2)} a contact

            </div>
            <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1">Reasons for contact it can answer</div>
            <div className="flex flex-wrap gap-1">
              {d.intents.map(x=><span key={x} className="text-[10.5px] px-1.5 py-0.5 rounded" style={{background:'var(--surface-3)',color:'var(--text-2)'}}>{x}</span>)}
            </div>
            <p className="text-[11px] t-muted mt-3 pt-3 border-t divider leading-relaxed">
              Growth is the revenue half of the case. This is the cost half: the same knowledge that grounds the
              copilot answers the contacts that never needed an agent. Containment is an assumption until measured.

        ):<div className="p-6"><EmptyState icon="clock" title="Working it out…" compact/></div>}
      </div>

  );
}

// ═══════════════════════════════════════════════════════════════════════════
//  GUIDED TOUR — chapter list, chapter cards, presenter bar
//  The audience sees a title and one plain sentence. The presenter's script
//  stays hidden until Notes is switched on.
// ═══════════════════════════════════════════════════════════════════════════

const actsOf=(story)=>{
  const acts=[];
  story.steps.forEach((s,i)=>{
    if(!acts.length||acts[acts.length-1].act!==s.act)acts.push({act:s.act,steps:[]});
    acts[acts.length-1].steps.push({...s,index:i});
  });
  return acts;
};

function StoryLauncher({story,onStart,onJump,onExplore}){
  if(!story)return null;
  const acts=actsOf(story);
  return(
    <div className="fixed inset-0 z-50 flex items-center justify-center p-6"
      style={{background:'rgba(12,18,28,.62)',backdropFilter:'blur(5px)'}}
      onClick={(e)=>{if(e.target===e.currentTarget)onExplore();}}>
      <div className="card celebrate w-full flex flex-col" style={{maxWidth:1080,maxHeight:'92%',boxShadow:'var(--shadow-lg)'}}>
        <div className="px-8 pt-7 pb-5 flex items-start justify-between gap-6 shrink-0" style={{borderBottom:'1px solid var(--border)'}}>
          <div>
            <div className="text-[11.5px] font-bold uppercase tracking-[.12em] mb-1.5" style={{color:COLORS.accent}}>Guided tour</div>
            <h2 className="text-[26px] font-extrabold t-primary leading-tight">From cost centre to growth centre</h2>
            <p className="text-[14.5px] t-secondary mt-1">
              {acts.length} chapters, about {story.total_minutes} minutes. Start at the beginning, or pick up anywhere.
            </p>
          </div>
          <button onClick={onExplore} className="t-muted p-1.5" aria-label="Close"><Icon name="x" size={20}/></button>
        </div>

        <div className="px-8 py-5 overflow-y-auto grid grid-cols-2 gap-x-8 gap-y-1">
          {acts.map((a,ai)=>(
            <div key={a.act} className="py-2">
              <div className="flex items-center gap-2.5 mb-1.5">
                <span className="w-6 h-6 rounded-full flex items-center justify-center text-[12px] font-extrabold text-white shrink-0"
                  style={{background:COLORS.accent}}>{ai+1}</span>
                <span className="text-[12px] font-bold uppercase tracking-[.1em] t-secondary">{a.act}</span>
              </div>
              {a.steps.map(s=>(
                <button key={s.n} onClick={()=>onJump(s.index)}
                  className="w-full text-left rounded-lg px-3 py-2 ml-2 flex items-start gap-3 transition-colors hover:bg-[#f0f6ff]"
                  style={{borderLeft:'2px solid var(--border)'}}>
                  <div className="min-w-0 flex-1">
                    <div className="text-[14.5px] font-bold t-primary leading-snug">
                      {s.title}{s.optional&&<span className="text-[11px] font-semibold t-muted ml-2">optional</span>}
                    </div>
                    <div className="text-[12.5px] t-secondary leading-snug mt-0.5">{s.takeaway}</div>
                  </div>
                  <span className="text-[11.5px] t-muted shrink-0 mt-0.5">{s.duration}</span>
                </button>
              ))}
            </div>
          ))}
        </div>

        <div className="px-8 py-5 flex items-center gap-3 shrink-0" style={{borderTop:'1px solid var(--border)',background:'var(--surface-2)',borderRadius:'0 0 8px 8px'}}>
          <button onClick={onStart}
            className="flex items-center gap-2.5 px-6 py-3 rounded-lg text-[15px] font-bold text-white"
            style={{background:COLORS.accent}}><Icon name="play" size={14}/>Start from the beginning</button>
          <button onClick={onExplore}
            className="px-5 py-3 rounded-lg text-[14px] font-semibold"
            style={{background:'var(--surface-3)',color:'var(--text-2)'}}>Explore on my own</button>
          <span className="ml-auto text-[12.5px] t-muted">
            <Kbd>←</Kbd> <Kbd>→</Kbd> move · <Kbd>N</Kbd> presenter notes · <Kbd>Esc</Kbd> leave
          </span>
        </div>
      </div>
    </div>
  );
}

function Kbd({children}){
  return <span className="mono text-[11px] font-bold px-1.5 py-0.5 rounded"
    style={{background:'var(--surface)',border:'1px solid var(--border-strong)',color:'var(--text-2)'}}>{children}</span>;
}

// A chapter card: a breath between acts, so the room knows where it is in the story.
function ChapterCard({step,chapter,chapters,leaving,onDismiss}){
  return(
    <div className="fixed inset-0 flex items-center justify-center p-10 cursor-pointer" onClick={onDismiss}
      style={{zIndex:80,background:'linear-gradient(120deg,#0f1622 0%,#1a2740 55%,#123a6e 100%)',color:'#fff',
        opacity:leaving?0:1,transition:'opacity .45s ease'}}>
      <div className="text-center celebrate" style={{maxWidth:980}}>
        <div className="flex items-center justify-center gap-1.5 mb-7">
          {Array.from({length:chapters}).map((_,i)=>(
            <span key={i} className="h-1 rounded-full" style={{width:i===chapter-1?44:18,
              background:i<chapter?'#4a9bf5':'rgba(255,255,255,.2)'}}></span>
          ))}
        </div>
        <div className="text-[14px] font-bold uppercase tracking-[.2em] mb-4" style={{color:'#8fbdf8'}}>
          Chapter {chapter} of {chapters} · {step.act}
        </div>
        <h2 className="text-[54px] font-extrabold leading-[1.05] tracking-tight">{step.title}</h2>
        <p className="text-[20px] leading-relaxed mt-6 mx-auto" style={{color:'#c7d3e2',maxWidth:760}}>{step.takeaway}</p>
      </div>
    </div>
  );
}

function PresenterBar({story,idx,notes,setNotes,onPrev,onNext,onExit,onJump,onOpenList,onHeight}){
  const ref=useRef(null);
  useEffect(()=>{
    if(!ref.current||!onHeight)return;
    const report=()=>onHeight(ref.current?ref.current.offsetHeight:0);
    report();
    let ro=null;
    if(window.ResizeObserver){ro=new ResizeObserver(report);ro.observe(ref.current);}
    return()=>{if(ro)ro.disconnect();};
  },[idx,notes]);
  if(!story)return null;
  const step=story.steps[idx];
  if(!step)return null;
  const total=story.steps.length;
  const acts=actsOf(story);
  const chapter=acts.findIndex(a=>a.act===step.act)+1;
  return(
    <div ref={ref} className="fixed bottom-0 left-0 right-0"
      style={{zIndex:60,background:'#141c29',color:'var(--chrome-text)',boxShadow:'0 -8px 30px rgba(12,18,28,.35)'}}>

      {/* Progress: one segment a step, a gap between chapters */}
      <div className="flex items-center gap-1.5 px-5 pt-2.5">
        {acts.map(a=>(
          <div key={a.act} className="flex gap-0.5" style={{flex:a.steps.length}}>
            {a.steps.map(s=>(
              <button key={s.n} onClick={()=>onJump(s.index)} title={`${s.n}. ${s.title}`}
                className="flex-1 rounded-full" style={{height:4,
                  background:s.index===idx?'#4a9bf5':(s.index<idx?'#5d6f86':'#2b3543')}}></button>
            ))}
          </div>
        ))}
      </div>

      {notes&&(
        <div className="px-5 pt-3 grid grid-cols-12 gap-5 fade-in">
          <div className="col-span-6">
            <div className="text-[10.5px] font-bold uppercase tracking-[.12em] mb-1" style={{color:'#8fbdf8'}}>Say</div>
            <p className="text-[14px] leading-snug" style={{color:'#e8edf4'}}>“{step.say}”</p>
          </div>
          <div className="col-span-3">
            <div className="text-[10.5px] font-bold uppercase tracking-[.12em] mb-1" style={{color:'#8fbdf8'}}>Point at</div>
            <p className="text-[13px] leading-snug" style={{color:'#c7d3e2'}}>{step.point}</p>
          </div>
          <div className="col-span-3">
            {step.beat&&(
              <>
                <div className="text-[10.5px] font-bold uppercase tracking-[.12em] mb-1" style={{color:'#f0b45f'}}>Land this</div>
                <p className="text-[13px] leading-snug" style={{color:'#f3d3a0'}}>{step.beat}</p>
              </>
            )}
          </div>
        </div>
      )}

      <div className="px-5 py-3 flex items-center gap-5">
        <button onClick={onOpenList} title="All chapters" className="shrink-0 text-center leading-none rounded-lg px-3 py-2"
          style={{background:'rgba(255,255,255,.07)'}}>
          <div className="text-[20px] font-extrabold">{step.n}<span className="text-[12px] font-semibold" style={{color:'var(--chrome-muted)'}}> / {total}</span></div>
        </button>

        <div className="flex-1 min-w-0">
          <div className="flex items-center gap-2 mb-0.5">
            <span className="text-[11px] font-bold uppercase tracking-[.12em]" style={{color:'#8fbdf8'}}>
              Chapter {chapter} · {step.act}
            </span>
            {step.optional&&<span className="text-[10.5px] font-semibold px-1.5 rounded" style={{background:'rgba(255,255,255,.1)',color:'var(--chrome-muted)'}}>optional</span>}
          </div>
          <div className="text-[19px] font-extrabold leading-tight truncate">{step.title}</div>
          <div className="text-[14px] leading-snug mt-0.5" style={{color:'#c7d3e2'}}>{step.takeaway}</div>
        </div>

        <div className="shrink-0 flex items-center gap-2">
          <button onClick={()=>setNotes(!notes)} title="Presenter notes (N)"
            className="flex items-center gap-1.5 px-3 py-2.5 rounded-lg text-[12.5px] font-bold"
            style={{background:notes?'#4a9bf5':'rgba(255,255,255,.08)',color:notes?'#fff':'#c7d3e2'}}>
            <Icon name="notes" size={15}/>Notes
          </button>
          <button onClick={onPrev} disabled={idx===0} aria-label="Previous step"
            className="px-3.5 py-2.5 rounded-lg transition-opacity"
            style={{background:'rgba(255,255,255,.08)',opacity:idx===0?0.35:1}}><Icon name="left" size={17}/></button>
          <button onClick={onNext} disabled={idx===total-1}
            className="flex items-center gap-2 px-5 py-2.5 rounded-lg text-[14px] font-bold text-white transition-opacity"
            style={{background:COLORS.accent,opacity:idx===total-1?0.45:1}}>Next<Icon name="right" size={16}/></button>
          <button onClick={onExit} title="Leave the tour (Esc)" aria-label="Leave the tour"
            className="px-3 py-2.5 rounded-lg" style={{background:'rgba(255,255,255,.08)',color:'#c7d3e2'}}><Icon name="x" size={16}/></button>
        </div>
      </div>
    </div>
  );
}

// ─── Live contact launcher: who is calling, and about what ───
function LiveLauncher({options,onStart,onClose,busy}){
  const[who,setWho]=useState('random');
  const[intent,setIntent]=useState('');

  const person=options.customers.find(x=>x.id===who);

  const families=['capacity','value','growth','explorer','recovery','access'];
  return(
    <div className="fixed inset-0 z-50 flex items-center justify-center p-6"
      style={{background:'rgba(19,19,19,.55)',backdropFilter:'blur(4px)'}}
      onClick={(e)=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="card celebrate max-w-3xl w-full" style={{boxShadow:'var(--shadow-lg)'}}>
        <div className="px-6 pt-6 pb-5">
          <div className="flex items-start justify-between gap-5 mb-4">

              <div className="text-[11.5px] font-bold uppercase tracking-[.12em] mb-1" style={{color:COLORS.purple}}>

          </div>

          <div className="flex items-center gap-2.5 pt-4 border-t divider">
            <span className="flex items-center rounded overflow-hidden" style={{border:'1px solid var(--border)'}}>
              {[['voice','Phone call'],['chat','Chat']].map(([k,l])=>(
                <button key={k} onClick={()=>setChannel(k)} className="text-[12px] font-bold px-3 py-2"

              Try being angry: say you have been charged twice. The engine stops selling, whoever you are.
            </span>
            <button onClick={()=>onStart({customer:who,intent:intent||null,channel})} disabled={busy}
              className="px-5 py-2.5 rounded-md text-[14px] font-bold text-white shrink-0"
              style={{background:COLORS.accent,opacity:busy?0.6:1}}>{busy?'Connecting…':'Start the call'}</button>
          </div>
        </div>
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
