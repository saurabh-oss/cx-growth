function AnalyticsPage({analytics,leads,voc}){
  const chartRef1=useRef(null), chartRef2=useRef(null);
  const chart1=useRef(null), chart2=useRef(null);

  useEffect(()=>{
    if(!analytics||!chartRef1.current||!chartRef2.current)return;
    if(chart1.current)chart1.current.destroy();
    if(chart2.current)chart2.current.destroy();

    // Canvas sizing is driven manually rather than by Chart.js's `responsive` mode.
    // The Tailwind Play CDN generates its stylesheet asynchronously, so at construction
    // time the grid layout has often not applied and the card still measures full width.
    // A ResizeObserver re-fits the charts the instant the real layout lands.
    const fit=(cv,ref,h)=>{
      if(!cv||!cv.parentElement)return;
      const w=cv.parentElement.clientWidth;
      if(!w)return;
      cv.style.width=w+'px';cv.style.height=h+'px';
      if(ref.current)ref.current.resize(w,h);
    };
    const GRID='#eaeff6', TICK='#8494a8', LABEL='#4b4b4b';

    chart1.current=new Chart(chartRef1.current,{
      type:'doughnut',
      data:{labels:['Upsell','Cross-Sell','New Sale','Retention'],
        datasets:[{data:[analytics.by_type.upsell||0,analytics.by_type.cross_sell||0,analytics.by_type.new_sale||0,analytics.by_type.retention||0],
          backgroundColor:[cf('blue'),cf('amber'),cf('purple'),cf('green')],borderWidth:3,borderColor:'#fff',hoverOffset:6}]},
      options:{responsive:false,maintainAspectRatio:false,cutout:'68%',
        plugins:{legend:{display:false},tooltip:{backgroundColor:'#131313',padding:10,cornerRadius:8}},
        animation:{animateRotate:true,duration:1100}}
    });
    const hours=analytics.by_hour||[];
    const past=(h)=>h.hour<=analytics.now_hour;
    chart2.current=new Chart(chartRef2.current,{
      type:'bar',
      data:{labels:hours.map(h=>String(h.hour).padStart(2,'0')+':00'),
        datasets:[
          {label:'Routed to sell',data:hours.map(h=>h.routed),backgroundColor:hours.map(h=>past(h)?'#c9d6e6':'#e9eef5'),borderRadius:4,maxBarThickness:22},
          {label:'Qualified',data:hours.map(h=>h.qualified),backgroundColor:hours.map(h=>past(h)?cf('accent'):'#cfe0fb'),borderRadius:4,maxBarThickness:22},
          {label:'Converted',data:hours.map(h=>h.converted),backgroundColor:hours.map(h=>past(h)?cf('green'):'#c4e8d5'),borderRadius:4,maxBarThickness:22},
        ]},
      options:{responsive:false,maintainAspectRatio:false,
        scales:{x:{grid:{display:false},border:{color:GRID},ticks:{color:TICK,font:{size:10,weight:'600'}}},
          y:{beginAtZero:true,grid:{color:GRID},border:{display:false},ticks:{color:TICK,font:{size:10},precision:0}}},
        plugins:{legend:{labels:{color:LABEL,font:{size:11,weight:'600'},boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:'circle'}},
          tooltip:{backgroundColor:'#131313',padding:10,cornerRadius:8}},
        animation:{duration:1100}}
    });

    const refit=()=>{fit(chartRef1.current,chart1,210);fit(chartRef2.current,chart2,240);};
    refit();
    let ro=null;
    if(window.ResizeObserver){
      ro=new ResizeObserver(refit);
      if(chartRef1.current.parentElement)ro.observe(chartRef1.current.parentElement);
      if(chartRef2.current.parentElement)ro.observe(chartRef2.current.parentElement);
    }
    window.addEventListener('resize',refit);
    const t1=setTimeout(refit,300),t2=setTimeout(refit,1200);
    return()=>{
      clearTimeout(t1);clearTimeout(t2);
      window.removeEventListener('resize',refit);
      if(ro)ro.disconnect();
      if(chart1.current){chart1.current.destroy();chart1.current=null;}
      if(chart2.current){chart2.current.destroy();chart2.current=null;}
    };
  },[analytics,leads]);

  if(!analytics)return <div className="max-w-2xl mx-auto"><EmptyState icon="chart" title="No data yet" body="Take a contact from the workspace to generate analytics."/></div>;

  const legend=[['Upsell','blue',analytics.by_type.upsell||0],['Cross-Sell','amber',analytics.by_type.cross_sell||0],
    ['New Sale','purple',analytics.by_type.new_sale||0],['Retention','green',analytics.by_type.retention||0]];

  return(
    <div className="max-w-[1180px] mx-auto fade-in">
      <div className="text-[11.5px] font-bold uppercase tracking-[.12em] mb-1" style={{color:COLORS.accent}}>The business case</div>
      <h1 className="text-[26px] font-extrabold t-primary leading-tight">Customer insights</h1>
      <p className="text-[14.5px] t-secondary mt-1 mb-5">Why customers are calling, what is changing, and what the engine has produced</p>

      <div className="grid grid-cols-5 gap-3.5 mb-5">
        {[['target',analytics.total_leads,'Leads captured so far','accent'],
          ['dollar',money(analytics.total_pipeline_value),'New yearly revenue','amber'],
          ['chart',`${analytics.avg_score.toFixed(0)}%`,'Average strength of lead','blue'],
          ['check',`${(analytics.avg_confidence*100).toFixed(0)}%`,'Average confidence','green'],
          ['refresh',`${(analytics.conversion_rate*100).toFixed(0)}%`,'Leads that become sales','purple']].map(([icon,val,label,tone],i)=>(
          <div key={label} className="card p-3.5 flex items-center gap-3 slide-in-u" style={{animationDelay:`${i*0.05}s`}}>
            <span className="w-9 h-9 rounded-lg flex items-center justify-center text-[15px] shrink-0" style={{background:cs(tone),color:c(tone)}}><Icon name={icon} size={18}/></span>
            <div className="min-w-0">
              <div className="text-[18px] font-extrabold leading-none" style={{color:c(tone)}}>{val}</div>
              <div className="text-[11.5px] t-secondary font-medium truncate mt-1">{label}</div>
            </div>
          </div>
        ))}
      </div>

      {voc&&<VocPanel voc={voc}/>}

      {analytics.scale&&<ScalePanel s={analytics.scale}/>}

      <div className="grid grid-cols-2 gap-4 mb-5">
        <div className="card p-4">
          <h3 className="text-[14.5px] font-bold t-primary mb-3">Kinds of lead captured so far</h3>
          <div style={{position:'relative',height:210,width:'100%',overflow:'hidden'}}>
            <canvas ref={chartRef1} style={{display:'block',width:'100%',height:'100%'}}></canvas>
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
              <div className="text-[24px] font-extrabold t-primary leading-none">{analytics.total_leads}</div>
              <div className="text-[10px] t-muted font-semibold uppercase tracking-wide mt-1">Leads</div>
            </div>
          </div>
          <div className="flex justify-center flex-wrap gap-4 mt-3.5 pt-3.5 border-t divider">
            {legend.map(([label,tone,count])=>(
              <div key={label} className="flex items-center gap-1.5">
                <span className="w-2.5 h-2.5 rounded-sm" style={{background:cf(tone)}}></span>
                <span className="text-[11.5px] t-secondary font-medium">{label}</span>
                <span className="mono text-[11.5px] font-bold t-primary">{count}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="card p-4">
          <div className="flex items-start justify-between gap-3 mb-3">
            <h3 className="text-[14.5px] font-bold t-primary">Through the day</h3>
            <span className="text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded shrink-0"
              style={{background:SOFT.amber,color:COLORS.amber}}>Simulated traffic</span>
          </div>
          <div style={{position:'relative',height:240,width:'100%',overflow:'hidden'}}>
            <canvas ref={chartRef2} style={{display:'block',width:'100%',height:'100%'}}></canvas>
          </div>
          <p className="text-[10.5px] t-muted mt-2">Hours still to come are shown faded.</p>
        </div>
      </div>

      <div className="card p-4">
        <h3 className="text-[13.5px] font-bold t-primary mb-3">Recent Leads</h3>
        <div className="overflow-x-auto">
          <table className="w-full text-[13px]">
            <thead>
              <tr style={{borderBottom:'1px solid var(--border)'}}>
                {['Customer','Segment','Type','Score','Value','Status'].map(h=>(
                  <th key={h} className="text-left py-2 font-bold t-muted text-[10.5px] uppercase tracking-wide">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {leads.length===0&&<tr><td colSpan="6" className="py-7 text-center t-muted text-[13px]">No leads captured yet</td></tr>}
              {leads.map(l=>{
                const tone=toneOf(l.lead_type);
                return(
                  <tr key={l.id} style={{borderBottom:'1px solid var(--border)'}}>
                    <td className="py-2.5 font-semibold t-primary">{l.customer_name}</td>
                    <td className="py-2.5 t-secondary">{l.company}</td>
                    <td className="py-2.5"><span className="text-[10.5px] px-2 py-0.5 rounded font-bold uppercase tracking-wide"
                      style={{background:cs(tone),color:c(tone)}}>{l.lead_type}</span></td>
                    <td className="py-2.5 mono font-bold" style={{color:COLORS.accent}}>{l.lead_score?l.lead_score.toFixed(0):0}%</td>
                    <td className="py-2.5 font-bold" style={{color:COLORS.green}}>{l.estimated_value}</td>
                    <td className="py-2.5"><span className="text-[10.5px] px-2 py-0.5 rounded font-semibold capitalize t-secondary"
                      style={{background:'var(--surface-3)'}}>{l.status}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── Voice of Customer Agent ───
const VOC_ACTION={fix:{label:'Fix the cause',tone:'red'},product:{label:'Offer it sooner',tone:'green'},
  deflect:{label:'Answer without an agent',tone:'accent'},watch:{label:'Keep watching',tone:'neutral'}};

function VocPanel({voc}){
  const[all,setAll]=useState(false);
  const rows=all?voc.themes:voc.themes.slice(0,8);
  const maxV=Math.max.apply(null,voc.themes.map(t=>t.volume));
  return(
    <div className="card mb-5 slide-in-u">
      <div className="panel-head">
        <span className="panel-title">Why customers are calling, and what is changing</span>
        <span className="ml-auto text-[10.5px] t-muted">{voc.window}</span>
      </div>
      <div className="p-4">
        {voc.headline.length>0&&(
          <div className="grid grid-cols-3 gap-3 mb-4">
            {voc.headline.map(t=>{
              const a=VOC_ACTION[t.action];
              return(
                <div key={t.intent} className="rounded-md p-3" style={{background:cs(a.tone),border:`1px solid ${c(a.tone)}33`}}>
                  <div className="flex items-center justify-between gap-2 mb-1">
                    <span className="text-[10px] font-bold uppercase tracking-wide" style={{color:c(a.tone)}}>{a.label}</span>
                    <span className="mono text-[12px] font-bold" style={{color:c(a.tone)}}>
                      {t.wow>=0?'▲':'▼'} {Math.abs(Math.round(t.wow*100))}%
                    </span>
                  </div>
                  <div className="text-[13.5px] font-bold t-primary leading-tight mb-1">{t.theme}</div>
                  <p className="text-[11px] t-secondary leading-snug mb-1.5">{t.insight}</p>
                  {t.verbatims[0]&&<div className="text-[11px] italic t-muted leading-snug">{t.verbatims[0]}</div>}
                </div>
              );
            })}
          </div>
        )}
        <table className="w-full text-[12.5px]">
          <thead>
            <tr style={{borderBottom:'1px solid var(--border)'}}>
              {['Reason for calling','Contacts today','','Against last week','Worth a sales conversation','Won today','What to do'].map((h,i)=>(
                <th key={i} className="text-left py-1.5 pr-2 font-bold t-muted text-[10px] uppercase tracking-wide">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(t=>{
              const a=VOC_ACTION[t.action];
              const up=t.wow>=0;
              const loud=Math.abs(t.wow)>=0.1;
              return(
                <tr key={t.intent} style={{borderBottom:'1px dashed var(--border)'}} title={t.insight}>
                  <td className="py-1.5 pr-2">
                    <div className="font-semibold t-primary leading-tight">{t.theme}</div>
                    <div className="text-[10.5px] t-muted italic leading-tight truncate" style={{maxWidth:260}}>{t.verbatims[0]||''}</div>
                  </td>
                  <td className="py-1.5 pr-2 mono t-primary w-[70px]">{t.volume.toLocaleString()}</td>
                  <td className="py-1.5 pr-2 w-[150px]">
                    <div className="h-1.5 rounded-full overflow-hidden" style={{background:'var(--surface-3)'}}>
                      <div className="h-full rounded-full" style={{width:(t.volume/maxV*100)+'%',background:c(SEG_TONE[t.family]||'neutral')}}></div>
                    </div>
                  </td>
                  <td className="py-1.5 pr-2 mono font-bold"
                    style={{color:!loud?'var(--text-3)':(t.action==='product'?COLORS.green:(up?COLORS.red:COLORS.green))}}>
                    {up?'+':'−'}{Math.abs(Math.round(t.wow*100))}%
                  </td>
                  <td className="py-1.5 pr-2 mono t-secondary">{Math.round(t.sell_share*100)}%</td>
                  <td className="py-1.5 pr-2 mono" style={{color:t.revenue?COLORS.green:'var(--text-3)'}}>{t.revenue?money(t.revenue):'—'}</td>
                  <td className="py-1.5"><span className="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded whitespace-nowrap"
                    style={{background:cs(a.tone),color:c(a.tone)}}>{a.label}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
        <div className="flex items-center justify-between gap-3 mt-2.5">
          <p className="text-[10.5px] t-muted leading-snug">
            {voc.contacts.toLocaleString()} contacts rolled up by the {voc.agent}. Volumes are simulated; verbatims are illustrative.
          </p>
          {voc.themes.length>8&&(
            <button onClick={()=>setAll(!all)} className="text-[11px] font-semibold px-2 py-1 rounded shrink-0"
              style={{background:'var(--surface-3)',color:'var(--text-2)'}}>{all?'Show fewer':'Show all '+voc.themes.length}</button>
          )}
        </div>
      </div>
    </div>
  );
}

//  EXECUTIVE VIEW — the growth-centre business case
// ═══════════════════════════════════════════════════════════════════════════
function ExecutivePage({exec}){
  const chartRef=useRef(null), chart=useRef(null);

  useEffect(()=>{
    if(!exec||!chartRef.current)return;
    if(chart.current)chart.current.destroy();
    const fit=()=>{
      const cv=chartRef.current;
      if(!cv||!cv.parentElement)return;
      const w=cv.parentElement.clientWidth;
      if(!w)return;
      cv.style.width=w+'px';cv.style.height='236px';
      if(chart.current)chart.current.resize(w,236);
    };
    chart.current=new Chart(chartRef.current,{
      data:{
        labels:exec.value_curve.map(q=>q.quarter),
        datasets:[
          {type:'bar',label:'Yearly revenue reached',data:exec.value_curve.map(q=>q.run_rate),
           backgroundColor:cf('accent'),borderRadius:5,maxBarThickness:56,order:2},
          {type:'line',label:'When fully rolled out',data:exec.value_curve.map(()=>exec.annual_arr),
           borderColor:COLORS.green,borderDash:[6,4],borderWidth:2,pointRadius:0,fill:false,order:1},
        ]
      },
      options:{responsive:false,maintainAspectRatio:false,
        scales:{x:{grid:{display:false},ticks:{color:'#8494a8',font:{size:11,weight:'600'}}},
          y:{beginAtZero:true,grid:{color:'#eaeff6'},border:{display:false},
             ticks:{color:'#8494a8',font:{size:10},callback:(v)=>'$'+(v/1000000).toFixed(0)+'M'}}},
        plugins:{legend:{labels:{color:'#4b4b4b',font:{size:11,weight:'600'},boxWidth:10,boxHeight:10,usePointStyle:true,pointStyle:'circle'}},
          tooltip:{backgroundColor:'#131313',padding:10,cornerRadius:8,
            callbacks:{label:(ctx)=>ctx.dataset.label+': $'+(ctx.parsed.y/1000000).toFixed(2)+'M'}}},
        animation:{duration:1100}}
    });
    fit();
    let ro=null;
    if(window.ResizeObserver){ro=new ResizeObserver(fit);if(chartRef.current.parentElement)ro.observe(chartRef.current.parentElement);}

// ═══════════════════════════════════════════════════════════════════════════
//  ARCHITECTURE — the TO-BE target state, rendered live
// ═══════════════════════════════════════════════════════════════════════════
const ARCH_TONE={
  existing:{bg:'#e8f1fc',bd:'#a9c9ee',fg:'#12457f'},
  vendor:{bg:'#fdeaea',bd:'#f0b6b3',fg:'#a3211c'},
  ai:{bg:'#fdf4e4',bd:'#eed3a4',fg:'#8a5106'},
  connector:{bg:'#e9f6ed',bd:'#b5ddc3',fg:'#1c6b3c'},
  foundation:{bg:'#f1ebfd',bd:'#cdb9f2',fg:'#5b2ba6'},
};
const BAND_TONE={vendor:'#a3211c',aws:'#1f3a5f',foundation:'#4a2a80'};
const STATUS_TONE={built:'green',partial:'amber',planned:'accent',reference:'neutral'};
const STATUS_WORD={built:'Working',partial:'Partly working',planned:'Still to build',reference:'Shown only'};

function ArchitecturePage({arch,step,playing,detail,setDetail,selected,setSelected,
  onStart,onStop,onPrev,onNext,onTogglePlay,onJump}){
  if(!arch)return <div className="max-w-2xl mx-auto"><EmptyState icon="layers" title="Loading architecture…"/></div>;

  const s=arch.summary;
  const tracing=step>=0;
  const trace=arch.trace;
  const cur=tracing?trace[step]:null;
  // Derived, never accumulated — exactly one component is ever "active".
  const focusId=cur?cur.target:null;
  const visited=tracing?trace.slice(0,step).map(t=>t.target):[];

  const stateFor=(id)=>{
    if(!tracing)return 'normal';
    if(id===focusId)return 'active';
    if(visited.indexOf(id)>=0)return 'visited';
    return 'dim';
  };
  const STYLE={
    normal:{op:1,ring:'none',lift:'none'},
    active:{op:1,ring:'0 0 0 4px rgba(2,101,220,.28), 0 8px 20px rgba(2,101,220,.2)',lift:'translateY(-2px)'},
    visited:{op:0.62,ring:'none',lift:'none'},
    dim:{op:0.16,ring:'none',lift:'none'},
  };

  // Component detail is hidden by default — 17 boxes x 3 bullets is 51 lines of noise.
  const showBullets=(cmp,st)=>detail||st==='active'||(selected&&selected.id===cmp.id);

  const Component=({cmp})=>{
    const t=ARCH_TONE[cmp.kind]||ARCH_TONE.existing;
    const st=stateFor(cmp.id);
    const sty=STYLE[st];
    const sel=selected&&selected.id===cmp.id;
    return(
      <button data-arch-id={cmp.id} onClick={()=>setSelected(sel?null:cmp)}
        className="flex-1 min-w-0 text-left rounded-md p-2.5 relative"
        style={{background:st==='active'?'#fff':t.bg,
          border:`1.5px solid ${st==='active'?COLORS.accent:(sel?t.fg:t.bd)}`,
          boxShadow:sty.ring,opacity:sty.op,transform:sty.lift,
          transition:'opacity .45s ease, box-shadow .45s ease, transform .45s ease'}}>
        {st==='visited'&&(
          <span className="absolute top-1.5 right-1.5 w-3.5 h-3.5 rounded-full flex items-center justify-center text-[10px] font-bold text-white"
            style={{background:COLORS.accent}}>✓</span>
        )}
        <div className="flex items-start justify-between gap-1.5 mb-1">
          <span className="text-[12px] font-bold leading-tight" style={{color:t.fg}}>
            {cmp.name}{cmp.star&&<span className="ml-1">★</span>}
          </span>
          {st!=='visited'&&cmp.agents&&cmp.agents.length>0&&(
            <span className="flex gap-0.5 shrink-0">
              {cmp.agents.map(a=>(
                <span key={a.id} title={a.name}
                  className="w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold text-white"
                  style={{background:a.status==='built'?COLORS.green:a.status==='partial'?COLORS.amber:COLORS.accent}}>{a.n}</span>
              ))}
            </span>
          )}
        </div>
        {showBullets(cmp,st)&&(
          <ul className="space-y-0.5 mb-1.5 fade-in">
            {cmp.items.map((it,i)=>(
              <li key={i} className="text-[10px] leading-snug t-secondary flex gap-1">
                <span className="shrink-0 t-muted">•</span><span className="min-w-0">{it}</span>
              </li>
            ))}
          </ul>
        )}
        <span className="inline-block text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded"
          style={{background:cs(STATUS_TONE[cmp.status]),color:c(STATUS_TONE[cmp.status])}}>
          {STATUS_WORD[cmp.status]||cmp.status}
        </span>
      </button>
    );
  };

  const Connector=({layer})=>{
    const st=stateFor(layer.id);
    const sty=STYLE[st];
    const t=ARCH_TONE.connector;
    return(
      <div data-arch-id={layer.id} className="rounded-md px-3 py-1.5 my-1.5"
        style={{background:st==='active'?'#fff':t.bg,
          border:`1.5px solid ${st==='active'?COLORS.accent:t.bd}`,
          boxShadow:sty.ring,opacity:sty.op,transform:sty.lift,
          transition:'opacity .45s ease, box-shadow .45s ease, transform .45s ease'}}>
        <span className="text-[11px] font-semibold italic" style={{color:st==='active'?COLORS.accent:t.fg}}>
          ⇄ {layer.title}
        </span>
      </div>
    );
  };

  // A band dims as a whole when nothing inside it is in play.
  const bandOpacity=(layer)=>{
    if(!tracing)return 1;
    const ids=(layer.components||[]).map(x=>x.id);
    if(ids.indexOf(focusId)>=0)return 1;
    if(ids.some(id=>visited.indexOf(id)>=0))return 0.7;
    return 0.3;
  };

  const Band=({layer,compact})=>(
    <div className={compact?'flex-1 min-w-0':''}
      style={Object.assign({opacity:bandOpacity(layer),transition:'opacity .45s ease'},
        layer.highlight?{padding:3,border:'2px dashed '+BAND_TONE.vendor,borderRadius:9}:{})}>
      <div className="rounded-t-md px-3 py-1.5 flex items-center gap-2"
        style={{background:BAND_TONE[layer.tone]||BAND_TONE.aws}}>
        <span className="text-[12px] font-bold text-white leading-tight">{layer.title}</span>
        {layer.badge&&(
          <span className="text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded shrink-0"
            style={{background:'rgba(255,255,255,.22)',color:'#fff'}}>{layer.badge}</span>
        )}
      </div>
      <div className="flex gap-1.5 p-1.5 rounded-b-md"
        style={{background:'var(--surface-2)',border:'1px solid var(--border)',borderTop:'none'}}>
        {layer.components.map(cmp=><Component key={cmp.id} cmp={cmp}/>)}
      </div>
    </div>
  );

  const halfBands=arch.layers.filter(l=>l.type==='band'&&l.width===0.5);

  return(
    <div className="max-w-[1320px] mx-auto fade-in">
      <div className="flex items-start justify-between gap-5 mb-4">
        <div>
          <div className="text-[11.5px] font-bold uppercase tracking-[.12em] mb-1" style={{color:COLORS.accent}}>Under the hood</div>
          <h1 className="text-[26px] font-extrabold t-primary leading-tight">The target architecture</h1>
          <p className="text-[14.5px] t-secondary mt-1">
            The architecture you approved — and, honestly, how much of it is already working here
          </p>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <label className="flex items-center gap-1.5 text-[12px] t-secondary font-medium cursor-pointer select-none">
            <input type="checkbox" checked={detail} onChange={e=>setDetail(e.target.checked)}/>
            Show detail
          </label>
          {!tracing
            ? <button onClick={onStart}
                className="px-3.5 py-2 rounded-md text-[13px] font-bold text-white"
                style={{background:COLORS.accent}}>Follow one contact through it</button>
            : <button onClick={onStop}
                className="px-3.5 py-2 rounded-md text-[13px] font-bold"
                style={{background:'var(--surface-3)',color:'var(--text-2)'}}>Stop following</button>}
        </div>
      </div>

      {/* ── STICKY TRACE CONTROLLER — one focus, always visible ── */}
      {tracing&&(
        <div className="sticky top-0 z-30 mb-3">
          <div className="card px-4 py-3" style={{background:'var(--chrome)',color:'var(--chrome-text)',borderColor:'#3b4757'}}>
            <div className="flex items-center gap-4">
              <div className="shrink-0 text-center leading-none">
                <div className="text-[19px] font-extrabold">{step+1}</div>
                <div className="text-[10px]" style={{color:'var(--chrome-muted)'}}>of {trace.length}</div>
              </div>
              <div className="flex-1 min-w-0">
                <div className="text-[14.5px] font-bold leading-tight">{cur.caption}</div>
                <div className="text-[11.5px] mt-0.5" style={{color:'var(--chrome-muted)'}}>
                  Now highlighting: <span className="font-semibold" style={{color:'#9dc2f5'}}>{cur.label||focusId}</span>
                </div>
              </div>
              <div className="shrink-0 flex items-center gap-1.5">
                <button onClick={onPrev} disabled={step===0}
                  className="px-3 py-1.5 rounded text-[13px] font-bold"
                  style={{background:'rgba(255,255,255,.1)',opacity:step===0?0.35:1}}>←</button>
                <button onClick={onTogglePlay}
                  className="px-3 py-1.5 rounded text-[13px] font-bold"
                  style={{background:'rgba(255,255,255,.1)'}}>{playing?'⏸':'▶'}</button>
                <button onClick={onNext} disabled={step===trace.length-1}
                  className="px-4 py-1.5 rounded text-[13px] font-bold text-white"
                  style={{background:COLORS.accent,opacity:step===trace.length-1?0.45:1}}>→</button>
              </div>
            </div>
            <div className="flex gap-1 mt-2.5">
              {trace.map((tr,i)=>(
                <button key={i} onClick={()=>onJump(i)} title={tr.caption}
                  className="flex-1 h-1 rounded-full"
                  style={{background:i===step?COLORS.accent:(i<step?'#6b7a8d':'#3b4757')}}></button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Coverage scorecard — hidden during trace to reduce competing focus */}
      {!tracing&&(
        <div className="grid grid-cols-5 gap-2.5 mb-4">
          {[['Building blocks',s.total,'in the architecture you approved','neutral'],
            ['Working',s.by_status.built||0,'fully, in this prototype','green'],
            ['Partly working',s.by_status.partial||0,'real, with limits we state','amber'],
            ['Still to build',s.by_status.planned||0,'next on the roadmap','accent'],
            ['Shown only',s.by_status.reference||0,'plumbing — nothing to demonstrate','neutral']].map(([l,v,n,tone])=>(
            <div key={l} className="card p-3">
              <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1">{l}</div>
              <div className="text-[20px] font-extrabold leading-none" style={{color:c(tone)}}>{v}</div>
              <div className="text-[10.5px] t-muted mt-1 leading-snug">{n}</div>
            </div>
          ))}
        </div>
      )}

      {/* The diagram */}
      <div className="card p-3.5 mb-4">
        <div className="mb-1.5" style={{opacity:tracing?bandOpacity(arch.layers[0]):1,transition:'opacity .45s ease'}}>
          <div className="text-[10px] font-bold uppercase tracking-[.09em] t-muted mb-1.5 pl-0.5">Channels</div>
          <div className="flex gap-1.5">
            {arch.layers[0].components.map(cmp=><Component key={cmp.id} cmp={cmp}/>)}
          </div>
        </div>

        {arch.layers.filter(l=>l.id==='edge').map(l=><Connector key={l.id} layer={l}/>)}
        {arch.layers.filter(l=>l.id==='orchestration').map(l=><Band key={l.id} layer={l}/>)}
        {arch.layers.filter(l=>l.id==='actions').map(l=><Connector key={l.id} layer={l}/>)}
        {arch.layers.filter(l=>l.id==='core').map(l=><Band key={l.id} layer={l}/>)}
        {arch.layers.filter(l=>l.id==='sync').map(l=><Connector key={l.id} layer={l}/>)}

        <div className="flex gap-2.5 mt-1.5">
          {halfBands.map(l=><Band key={l.id} layer={l} compact/>)}
        </div>

        {!tracing&&(
          <div className="flex items-center gap-4 flex-wrap mt-3.5 pt-3 border-t divider">
            {arch.legend.map(l=>{
              const t=ARCH_TONE[l.key];
              return(
                <div key={l.key} className="flex items-center gap-1.5">
                  <span className="w-3.5 h-3.5 rounded-sm shrink-0" style={{background:t.bg,border:`1.5px solid ${t.bd}`}}></span>
                  <span className="text-[11px] t-secondary font-medium">{l.label}</span>
                </div>
              );
            })}
            <div className="flex items-center gap-1.5">
              <span className="w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold text-white shrink-0"
                style={{background:COLORS.accent}}>n</span>
              <span className="text-[11px] t-secondary font-medium">Magnificent 7 Agent operating here</span>
            </div>
            <span className="ml-auto text-[11px] t-muted">Click any component for detail</span>
          </div>
        )}
      </div>

      {/* Detail drawer */}
      {selected&&(
        <div className="card slide-in-u mb-4" style={{borderColor:ARCH_TONE[selected.kind].bd}}>
          <div className="panel-head" style={{background:ARCH_TONE[selected.kind].bg}}>
            <span className="panel-title" style={{color:ARCH_TONE[selected.kind].fg}}>
              {selected.name}{selected.star?' ★':''}
            </span>
            <span className="ml-auto text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded"
              style={{background:cs(STATUS_TONE[selected.status]),color:c(STATUS_TONE[selected.status])}}>
              {arch.status_label[selected.status]}
            </span>
            <button onClick={()=>setSelected(null)} className="text-[14px] t-muted ml-2">✕</button>
          </div>
          <div className="p-4 grid grid-cols-3 gap-5">
            <div>
              <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1.5">Capabilities</div>
              <ul className="space-y-1">
                {selected.items.map((it,i)=>(
                  <li key={i} className="text-[12.5px] t-secondary leading-snug flex gap-1.5">
                    <span className="t-muted shrink-0">•</span>{it}
                  </li>
                ))}
              </ul>
            </div>
            <div className="col-span-2">
              <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1.5">What works here today</div>
              <p className="text-[13px] t-primary leading-relaxed">{selected.poc}</p>
              {selected.agents&&selected.agents.length>0&&(
                <div className="mt-3 pt-3 border-t divider">
                  <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1.5">Magnificent 7 agents operating here</div>
                  <div className="flex flex-wrap gap-1.5">
                    {selected.agents.map(a=>(
                      <span key={a.id} className="text-[11px] font-semibold px-2 py-0.5 rounded"
                        style={{background:cs(STATUS_TONE[a.status]),color:c(STATUS_TONE[a.status])}}>
                        {a.n}. {a.name}
                      </span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* Magnificent 7 — hidden during trace */}
      {!tracing&&arch.m7&&(
        <div className="card mb-4">
          <div className="panel-head">
            <span className="panel-title">“Magnificent 7” Goal-Based Agents</span>
            <span className="ml-auto flex items-center gap-3">
              {[['built','Working'],['partial','Partly working'],['planned','Still to build']].map(([k,l])=>(
                <span key={k} className="flex items-center gap-1.5">
                  <span className="w-2.5 h-2.5 rounded-full" style={{background:c(STATUS_TONE[k])}}></span>
                  <span className="text-[11px] t-secondary font-medium">{l} {arch.summary.agents.by_status[k]||0}</span>
                </span>
              ))}
            </span>
          </div>
          <div className="p-3.5 grid grid-cols-4 gap-2.5">
            {arch.m7.map(a=>{
              const tone=STATUS_TONE[a.status];
              return(
                <div key={a.id} className="rounded-md p-3"
                  style={{background:a.status==='built'?SOFT.green:'var(--surface-2)',
                    border:`1.5px solid ${a.status==='built'?'#b7e2c8':'var(--border)'}`}}>
                  <div className="flex items-start gap-2 mb-1.5">
                    <span className="w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-bold text-white shrink-0"
                      style={{background:c(tone)}}>{a.n}</span>
                    <span className="text-[12.5px] font-bold t-primary leading-tight">{a.name}</span>
                  </div>
                  <p className="text-[11px] t-secondary leading-snug mb-2">{a.goal}</p>
                  <span className="text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded"
                    style={{background:cs(tone),color:c(tone)}}>
                    {STATUS_WORD[a.status]||a.status}
                  </span>
                  <p className="text-[10.5px] t-muted leading-snug mt-2 pt-2" style={{borderTop:'1px dashed var(--border)'}}>{a.poc}</p>
                </div>
              );
            })}
            <div className="rounded-md p-3 flex flex-col justify-center"
              style={{background:'var(--chrome)',color:'var(--chrome-text)'}}>
              <div className="text-[12px] font-bold mb-1">
                {arch.summary.agents.by_status.built||0} of 7 working · {arch.summary.agents.by_status.partial||0} partly
              </div>
              <p className="text-[10.5px] leading-snug" style={{color:'var(--chrome-muted)'}}>
                Each one is on a screen in this prototype. Click an agent's component on the map to read exactly
                what is real and what is a stand-in.
              </p>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
//  INTELLIGENT CUSTOMER FRONTIER — IVR transformation
//  filter ▸ decision maker ▸ sales opportunity, with a feedback loop
// ═══════════════════════════════════════════════════════════════════════════
const GROUP_LABEL={filter:'Filter',decide:'Decision Maker',opportunity:'Sales Opportunity'};
const GROUP_TONE={filter:'neutral',decide:'accent',opportunity:'green'};
const SEG_TONE={capacity:'blue',value:'amber',growth:'green',recovery:'red',access:'neutral',explorer:'purple'};
const SEG_NAME={capacity:'Capacity',value:'Value',growth:'Growth',recovery:'Recovery',access:'Access',explorer:'Explorer'};
const FD_TABS=[['overview','Today at a glance'],['treatment','One contact, step by step'],
  ['selfservice','Before anyone calls']];
const TECH_TABS=[['platform','Customer data platform'],['model','The engine, and how it learns']];
const LANGUAGE={'en-GB':'English (UK)','en-US':'English (US)','es-ES':'Spanish (Spain)'};
const likely=(p)=>Math.round(p*100)+'%';
const pct=(v,d=0)=>(v*100).toFixed(d)+'%';

function PageHead({kicker,title,sub,tag,tabs,tab,setTab}){
  return(
    <>
      <div className="flex items-start justify-between gap-5 mb-4">
        <div>
          {kicker&&<div className="text-[12.5px] font-bold uppercase tracking-[.12em] mb-1" style={{color:COLORS.accent}}>{kicker}</div>}
          <h1 className="text-[26px] font-extrabold t-primary leading-tight">{title}</h1>
          {sub&&<p className="text-[14.5px] t-secondary mt-1">{sub}</p>}
        </div>
        {tag&&<span className="text-[12px] font-bold uppercase tracking-wide px-2.5 py-1 rounded-full shrink-0"
          style={{background:SOFT.amber,color:COLORS.amber}}>{tag}</span>}
      </div>
      {tabs&&(
        <div className="flex items-center gap-1 mb-5" style={{borderBottom:'1px solid var(--border)'}}>
          {tabs.map(([k,l])=>(
            <button key={k} onClick={()=>setTab(k)}
              className="text-[14px] font-bold px-4 py-2.5"
              style={{color:tab===k?COLORS.accent:'var(--text-3)',
                borderBottom:`3px solid ${tab===k?COLORS.accent:'transparent'}`,marginBottom:-1}}>{l}</button>
          ))}
        </div>
      )}
    </>
  );
}

function FrontDoorPage({fd,scenarios,selectedId,setSelectedId,stage,runTreatment,tab,setTab,feed,voc}){
  if(!fd)return <div className="max-w-2xl mx-auto"><EmptyState icon="clock" title="Loading…"/></div>;
  return(
    <div className="max-w-[1320px] mx-auto fade-in">
      <PageHead kicker="Step 1 · Before the call" title={fd.name}
        sub="Every contact is decided before it reaches an agent: solve the problem, or open a sales conversation."
        tag="Simulated traffic" tabs={FD_TABS} tab={tab} setTab={setTab}/>
      {tab==='overview'&&<FrontierOverview fd={fd} feed={feed}/>}
      {tab==='treatment'&&<FrontierTreatment fd={fd} scenarios={scenarios} selectedId={selectedId}
        setSelectedId={setSelectedId} stage={stage} runTreatment={runTreatment}/>}
      {tab==='selfservice'&&<FrontierSelfService voc={voc}/>}
    </div>
  );
}

// ─── Technology: for the people who will ask how it works ───
function TechnologyPage({fd,tab,setTab,modelCard,training,onTrain,onPromote,onReset,platformInfo,evaluation}){
  if(!fd)return <div className="max-w-2xl mx-auto"><EmptyState icon="clock" title="Loading…"/></div>;
  return(
    <div className="max-w-[1320px] mx-auto fade-in">
      <PageHead kicker="Under the hood" title="Technology"
        sub="For the technical conversation. Where the customer data lives, how the engine decides, and how it learns."
        tabs={TECH_TABS} tab={tab} setTab={setTab}/>
      <div className="card p-4 mb-5 flex items-start gap-3" style={{background:SOFT.accent,borderColor:'#bcd7fb'}}>
        <span style={{color:COLORS.accent}}><Icon name="bulb" size={20}/></span>
        <p className="text-[14px] leading-relaxed" style={{color:'#0b4ea8'}}>
          {tab==='platform'
            ? <><strong>In one sentence:</strong> customer data is already held in Acme's own format, so moving to Acme
                Experience Platform is a change of configuration — not a rebuild.</>
            : <><strong>In one sentence:</strong> the engine scores each customer on seventeen facts we already hold, it
                can show exactly why, and it only changes when a person approves a better version.</>}
        </p>
      </div>
      {tab==='model'&&<FrontierModel fd={fd} card={modelCard} training={training}
        onTrain={onTrain} onPromote={onPromote} onReset={onReset} evaluation={evaluation}/>}
      {tab==='platform'&&<FrontierPlatform info={platformInfo}/>}
    </div>
  );
}

// ─── Overview: live traffic, funnel, threshold, segments ───
function FrontierOverview({fd,feed}){
  const maxV=fd.funnel.stages[0].value;
  const op=fd.threshold;
  const[thr,setThr]=useState(op);
  useEffect(()=>{setThr(op);},[op]);
  const row=(t)=>fd.sweep.reduce((a,b)=>Math.abs(b.threshold-t)<Math.abs(a.threshold-t)?b:a,fd.sweep[0]);
  const at=row(thr), base=row(op);
  const maxSell=Math.max.apply(null,fd.sweep.map(r=>r.sell_treated));
  const delta=(a,b)=>{const d=a-b;return d===0?'no change':(d>0?'+':'−')+Math.abs(d).toLocaleString();};

  return(
    <>
      {/* The reframe */}
      <div className="card p-4 mb-4" style={{background:'var(--chrome)',color:'var(--chrome-text)'}}>
        <div className="flex items-center gap-4 flex-wrap">
          <div className="flex-1 min-w-[220px]">
            <div className="text-[10px] uppercase tracking-wide font-bold mb-1" style={{color:'var(--chrome-muted)'}}>Today</div>
            <div className="text-[16px] font-bold">The phone menu sorts customers by what they say they want</div>
          </div>
          <span className="text-[18px] shrink-0" style={{color:'var(--chrome-muted)'}}>→</span>
          <div className="flex-1 min-w-[220px]">
            <div className="text-[10px] uppercase tracking-wide font-bold mb-1" style={{color:'var(--chrome-muted)'}}>Intelligent Customer Frontier</div>
            <div className="text-[16px] font-bold">It sorts them by what we already know, and decides how to treat them</div>
          </div>
          <div className="px-4 py-2.5 rounded-lg shrink-0" style={{background:'rgba(255,255,255,.1)'}}>
            <div className="text-[13px] font-bold">Recognise → Understand → Decide → Route</div>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-12 gap-4 mb-4">
        {/* ── LIVE TRAFFIC ── */}
        <div className="col-span-5 card flex flex-col">
          <div className="panel-head">
            <span className="live-dot"></span>
            <span className="panel-title">Arriving now{feed?' · '+feed.clock:''}</span>
            <span className="ml-auto mono text-[10.5px] t-muted">{feed?feed.per_minute+' / min':''}</span>
          </div>
          {!feed&&<div className="p-6"><EmptyState icon="clock" title="Connecting…" compact/></div>}
          {feed&&(
            <>
              <div className="grid grid-cols-4" style={{borderBottom:'1px solid var(--border)'}}>
                {[['Contacts so far',feed.so_far.contacts.toLocaleString(),'neutral'],
                  ['Sell',feed.so_far.sell.toLocaleString(),'green'],
                  ['Held back',feed.so_far.overrides.toLocaleString(),'red'],
                  ['Won today',money(feed.so_far.revenue),'green']].map(([l,v,tone])=>(
                  <div key={l} className="px-3 py-2.5" style={{borderRight:'1px solid var(--border)'}}>
                    <div className="text-[15px] font-extrabold leading-none" style={{color:tone==='neutral'?'var(--text)':c(tone)}}>{v}</div>
                    <div className="text-[10px] t-muted mt-1">{l}</div>
                  </div>
                ))}
              </div>
              <div className="flex-1 overflow-hidden">
                {feed.items.slice(0,8).map(it=>{
                  const sell=it.decision==='sell';
                  return(
                    <div key={it.id} className="signal-enter px-3 py-1.5 flex items-center gap-2"
                      style={{borderBottom:'1px solid var(--border)'}}>
                      <span className="mono text-[10px] t-muted w-[50px] shrink-0">{it.time}</span>
                      <div className="min-w-0 flex-1 leading-tight">
                        <div className="text-[11.5px] font-semibold t-primary truncate">{it.customer}</div>
                        <div className="text-[10px] t-muted truncate">{it.intent}</div>
                      </div>
                      <span className="text-[10px] font-bold uppercase tracking-wide px-1 py-0.5 rounded shrink-0"
                        style={{background:cs(SEG_TONE[it.segment]),color:c(SEG_TONE[it.segment])}}>{SEG_NAME[it.segment]}</span>
                      <span className="text-[10px] font-semibold t-muted w-[34px] text-right shrink-0"
                        title="How likely this customer is to buy">
                        {it.propensity===null?'—':likely(it.propensity)}
                      </span>
                      <span className="text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded shrink-0 w-[46px] text-center"
                        title={it.override?'Likely to buy, and held back by a safety check':(it.explore?'Routed to sell as a test, so the engine keeps learning':'')}
                        style={{background:it.override?SOFT.red:sell?SOFT.green:'var(--surface-3)',
                          color:it.override?COLORS.red:sell?COLORS.green:'var(--text-3)'}}>
                        {it.override?'held':it.decision}
                      </span>
                    </div>
                  );
                })}
              </div>
              <p className="text-[10.5px] t-muted px-3 py-2 leading-snug" style={{borderTop:'1px solid var(--border)'}}>
                A simulated day, replayed against the clock. Every contact is decided by the same engine you will see at work.
              </p>
            </>
          )}
        </div>

        {/* ── VOLUME FUNNEL ── */}
        <div className="col-span-7 card p-5" data-tour="funnel">
          <div className="flex items-start justify-between gap-4 mb-4">
            <div>
              <h3 className="text-[15px] font-bold t-primary">Where {maxV.toLocaleString()} contacts go</h3>
              <p className="text-[12px] t-secondary mt-0.5">Filter the volume, decide the treatment, surface the opportunity</p>
            </div>
            <div className="flex items-center gap-3 shrink-0">
              {Object.keys(GROUP_LABEL).map(g=>(
                <span key={g} className="flex items-center gap-1.5">
                  <span className="w-2.5 h-2.5 rounded-sm" style={{background:c(GROUP_TONE[g])}}></span>
                  <span className="text-[11px] t-secondary font-medium">{GROUP_LABEL[g]}</span>
                </span>
              ))}
            </div>
          </div>
          <div className="space-y-1.5">
            {fd.funnel.stages.map((st,i)=>{
              const p=(st.value/maxV)*100;
              const tone=GROUP_TONE[st.group];
              return(
                <div key={st.stage} className="flex items-center gap-3 slide-in-r" style={{animationDelay:`${i*0.05}s`}}>
                  <div className="w-[176px] shrink-0 text-right">
                    <div className="text-[12.5px] font-semibold t-primary leading-tight">{st.stage}</div>
                    <div className="text-[10.5px] t-muted leading-tight">{st.note}</div>
                  </div>
                  <div className="flex-1 h-7 rounded-md relative overflow-hidden" style={{background:'var(--surface-3)'}}>
                    <div className="h-full rounded-md flex items-center justify-end px-2.5"
                      style={{width:`${Math.max(p,8)}%`,background:c(tone),transition:'width .9s cubic-bezier(.16,1,.3,1)'}}>
                      <span className="mono text-[12px] font-bold text-white">{st.value.toLocaleString()}</span>
                    </div>
                  </div>
                  <div className="w-[44px] shrink-0 mono text-[11px] font-semibold t-muted">
                    {p>=1?p.toFixed(0)+'%':'<1%'}
                  </div>
                </div>
              );
            })}
          </div>
          <p className="text-[11.5px] t-muted mt-4 pt-3.5 border-t divider leading-relaxed">
            <strong className="t-secondary">{pct(fd.funnel.sell_leaning_share)}</strong> of customers might welcome an
            offer, but only <strong className="t-secondary">{pct(fd.funnel.triage_rate)}</strong> are worth a sales
            conversation. Most of the work is deciding who to leave alone.
          </p>
        </div>
      </div>

      {/* ── THE DIAL ── */}
      <div className="card p-5 mb-4" id="fd-threshold">
        <div className="flex items-start justify-between gap-4 mb-3">
          <div>
            <h3 className="text-[15px] font-bold t-primary">How selective should we be?</h3>
            <p className="text-[12px] t-secondary mt-0.5">
              A business choice, not a technical one. Drag the slider: offer to more customers and find more revenue,
              at the price of more conversations that lead nowhere.
            </p>
          </div>
          <span className="text-[10px] font-bold uppercase tracking-wide px-2 py-1 rounded shrink-0"
            style={{background:SOFT.accent,color:COLORS.accent}}>Try it · nothing is changed</span>
        </div>
        <div className="grid grid-cols-12 gap-5 items-end">
          <div className="col-span-7">
            <div className="flex items-end gap-1 h-[92px]">
              {fd.sweep.map(r=>{
                const sel=r.threshold===at.threshold, isOp=r.threshold===base.threshold;
                return(
                  <button key={r.threshold} onClick={()=>setThr(r.threshold)} title={`Offer when ${likely(r.threshold)} likely to buy, or more`}
                    className="flex-1 flex flex-col items-center justify-end h-full">
                    <span className="mono text-[10px] mb-0.5" style={{color:sel?COLORS.accent:'var(--text-3)'}}>{r.sell_treated.toLocaleString()}</span>
                    <span className="w-full rounded-t"
                      style={{height:`${Math.max(4,(r.sell_treated/maxSell)*68)}px`,
                        background:sel?COLORS.accent:(isOp?'#8cbdf5':'#d5dde8'),transition:'height .4s, background .2s'}}></span>
                  </button>
                );
              })}
            </div>
            <input type="range" min="0.30" max="0.90" step="0.05" value={thr}
              onChange={e=>setThr(parseFloat(e.target.value))} className="w-full mt-1.5"
              aria-label="Propensity threshold"/>
            <div className="flex justify-between">
              <span className="text-[10px] t-muted">← Offer to more customers</span>
              <span className="text-[10px] font-bold" style={{color:COLORS.accent}}>
                Offer when {likely(at.threshold)} likely to buy{at.threshold===base.threshold?' · today\'s setting':''}
              </span>
              <span className="text-[10px] t-muted">Offer to fewer →</span>
            </div>
          </div>
          <div className="col-span-5 grid grid-cols-2 gap-2">
            {[['Sales conversations a day',at.sell_treated.toLocaleString(),delta(at.sell_treated,base.sell_treated),'neutral'],
              ['With a real opportunity',pct(at.precision),(at.no_opportunity).toLocaleString()+' with nothing to find','accent'],
              ['Sales a day',at.converted.toLocaleString(),delta(at.converted,base.converted),'green'],
              ['Revenue a year',money(at.revenue_day*365),
                (at.revenue_day===base.revenue_day?'no change':(at.revenue_day>base.revenue_day?'+':'−')+money(Math.abs(at.revenue_day-base.revenue_day)*365)),'green'],
            ].map(([l,v,n,tone])=>(
              <div key={l} className="card-2 px-3 py-2.5">
                <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1">{l}</div>
                <div className="text-[17px] font-extrabold leading-none" style={{color:tone==='neutral'?'var(--text)':c(tone)}}>{v}</div>
                <div className="text-[10.5px] t-muted mt-1">{at.threshold===base.threshold&&n.indexOf('with')<0?'at today\'s setting':n+(n.indexOf('with')<0&&n!=='no change'?' against today':'')}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ── SEGMENTS ── */}
      <div className="card mb-4">
        <div className="panel-head">
          <span className="panel-title">Six kinds of contact · every one is exactly one of these</span>
          <span className="ml-auto text-[11px] t-muted">Shares counted from the simulated day</span>
        </div>
        <div className="p-3.5 grid grid-cols-3 gap-2.5">
          {fd.segments.map(sg=>(
            <div key={sg.id} className="rounded-md p-3"
              style={{background:cs(sg.tone),border:`1px solid ${c(sg.tone)}33`}}>
              <div className="flex items-center justify-between gap-2 mb-1.5">
                <span className="text-[13px] font-bold" style={{color:c(sg.tone)}}>{sg.name}</span>
                <span className="text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded shrink-0"
                  style={{background:'var(--surface)',color:c(sg.default==='sell'?'green':'neutral')}}>
                  {sg.default}
                </span>
              </div>
              <p className="text-[11px] t-secondary leading-snug mb-2">{sg.definition}</p>
              <div className="flex items-center justify-between gap-2">
                <span className="mono text-[11px] font-bold" style={{color:c(sg.tone)}}>
                  {pct(sg.share)} of contacts{sg.count!==null?' · '+sg.count.toLocaleString():''}
                </span>
                {sg.overrides&&(
                  <span className="text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded"
                    style={{background:SOFT.red,color:COLORS.red}}>overrides</span>
                )}
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="grid grid-cols-12 gap-4">
        {/* ── ASSUMPTIONS, CHECKED ── */}
        <div className="col-span-5 card">
          <div className="panel-head"><span className="panel-title">Our assumptions, checked</span></div>
          <div className="p-4">
            <table className="w-full text-[12.5px]">
              <thead>
                <tr style={{borderBottom:'1px solid var(--border)'}}>
                  {['','We assumed','The simulation gave'].map(h=>(
                    <th key={h} className="text-left py-1.5 font-bold t-muted text-[10px] uppercase tracking-wide">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {fd.reconcile.map(r=>(
                  <tr key={r.rate} style={{borderBottom:'1px dashed var(--border)'}}>
                    <td className="py-1.5 t-secondary">{r.rate}</td>
                    <td className="py-1.5 mono font-semibold t-primary">{r.money?'$'+r.assumed:pct(r.assumed)}</td>
                    <td className="py-1.5 mono font-bold" style={{color:COLORS.accent}}>{r.money?'$'+r.simulated:pct(r.simulated,1)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <p className="text-[11px] t-muted mt-3 leading-relaxed">
              The simulated customers were built to sit near our assumptions, so this shows the sums hold
              together — not what real customers will do. Value Discovery replaces both columns with your numbers.
            </p>
          </div>
        </div>

        {/* ── OFFER CATALOGUE ── */}
        <div className="col-span-7 card">
          <div className="panel-head">
            <span className="panel-title">What it can offer</span>
            <span className="ml-auto text-[11px] t-muted">Illustrative prices, per month</span>
          </div>
          <div className="p-3.5 grid grid-cols-3 gap-2.5">
            {fd.price_list.map(g=>{
              const tone=CLOUD_TONE[g.cloud]||'neutral';
              return(
                <div key={g.cloud} className="rounded-md p-3" style={{background:cs(tone),border:`1px solid ${c(tone)}33`}}>
                  <div className="text-[12.5px] font-bold mb-2" style={{color:c(tone)}}>{g.cloud}</div>
                  {g.plans.map(p=>(
                    <div key={p.code} className="flex items-baseline justify-between gap-2 py-0.5">
                      <span className="text-[10.5px] t-secondary leading-tight">{p.name}</span>
                      <span className="mono text-[10px] font-bold t-primary shrink-0">
                        {p.quote_based?'quote':(p.monthly===0?'free':'$'+p.monthly.toFixed(2)+(p.per_seat?'/seat':''))}
                      </span>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
          <p className="text-[11px] t-muted px-4 pb-3.5 leading-relaxed">
            One offer per customer, chosen from this list. It can recommend across all three clouds — which a
            sales team organised by product line rarely does.
          </p>
        </div>
      </div>
    </>
  );
}

// ─── Call treatment: one contact, stage by stage, with what-if switches ───
function FrontierTreatment({fd,scenarios,selectedId,setSelectedId,stage,runTreatment}){
  const[switches,setSwitches]=useState([]);
  const[alt,setAlt]=useState(null);
  useEffect(()=>{setSwitches([]);setAlt(null);},[selectedId,fd.threshold]);

  const toggle=(id)=>{
    const next=switches.indexOf(id)>=0?switches.filter(x=>x!==id):switches.concat([id]);
    setSwitches(next);
    if(!next.length){setAlt(null);return;}
    fetch(API+'/frontier/whatif',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({scenario_id:selectedId,switches:next})})
      .then(r=>r.json()).then(setAlt).catch(()=>{});
  };

  const base=fd.treatments[selectedId];
  const t=alt||base;
  const sc=scenarios.find(s=>s.id===selectedId);
  const st=alt?6:stage;
  if(!t)return null;
  const maxW=Math.max.apply(null,t.features.map(x=>x.weight).concat([0.01]));
  const sell=t.decision==='sell';

  return(
    <>
      <div className="card mb-4" id="fd-treatment">
        <div className="panel-head">
          <span className="panel-title">One contact, step by step</span>
          <span className="ml-auto flex items-center gap-1.5 flex-wrap justify-end">
            {scenarios.map(s=>(
              <button key={s.id} onClick={()=>{setSelectedId(s.id);runTreatment(s.id);}}
                className="text-[11px] font-semibold px-2 py-1 rounded transition-colors"
                style={{background:selectedId===s.id?SOFT.accent:'var(--surface-3)',
                  color:selectedId===s.id?COLORS.accent:'var(--text-2)'}}>
                {s.customer.name.split(' ')[0]}
              </button>
            ))}
          </span>
        </div>

        <div className="p-4">
          <div className="grid grid-cols-5 gap-2.5">
            {/* 1 — IVR */}
            <TreatStage n={1} title="Why they called" active={st>=1}>
              <KV k="Reason given" v={t.intent_label||t.ivr.intent}/>
              <KV k="Phone menu" v={t.ivr.path}/>
              <KV k="Identity" v={t.ivr.identity}/>
              <KV k="Language" v={LANGUAGE[t.ivr.language]||t.ivr.language}/>
              <KV k="Time in the menu" v={t.ivr.duration+' min'}/>
            </TreatStage>

            {/* 2 — Background model */}
            <TreatStage n={2} title="What we already knew" active={st>=2} wide tour="evidence">
              <p className="text-[10.5px] t-muted leading-snug mb-2">
                From the customer's record — before a word is spoken. Longer bars counted for more.
              </p>
              <div className="space-y-1.5">
                {t.features.map((f,i)=>(
                  <div key={f.id}>
                    <div className="flex items-center justify-between gap-2">
                      <span className="text-[10.5px] font-semibold t-primary truncate">{f.name}</span>
                      <span className="text-[10px] font-bold shrink-0" style={{color:f.direction==='up'?COLORS.green:COLORS.red}}
                        title={f.direction==='up'?'Makes a sale more likely':'Makes a sale less likely'}>
                        {f.direction==='up'?'▲':'▼'} {Math.round(f.weight*100)}%
                      </span>
                    </div>
                    <div className="flex items-center gap-1.5">
                      <div className="flex-1 h-1 rounded-full overflow-hidden" style={{background:'var(--surface-3)'}}>
                        <div className="h-full rounded-full"
                          style={{width:st>=2?`${(f.weight/maxW)*100}%`:'0%',maxWidth:'100%',
                            background:f.direction==='up'?COLORS.green:COLORS.red,
                            transition:`width .8s cubic-bezier(.16,1,.3,1) ${i*0.06}s`}}></div>
                      </div>
                    </div>
                    <div className="text-[10px] t-muted leading-tight">{f.value}</div>
                  </div>
                ))}
              </div>
            </TreatStage>

            {/* 3 — Segment */}
            <TreatStage n={3} title="What kind of contact" active={st>=3}>
              <div className="rounded-md p-2.5 mb-2" style={{background:cs(t.segment_detail.tone)}}>
                <div className="text-[13px] font-bold" style={{color:c(t.segment_detail.tone)}}>{t.segment_detail.name}</div>
                <div className="text-[10px] mt-0.5 leading-snug" style={{color:c(t.segment_detail.tone),opacity:.85}}>
                  {t.segment_reason}
                </div>
              </div>
              <p className="text-[10.5px] t-secondary leading-snug mb-2">{t.segment_detail.definition}</p>
              <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1">How to handle it</div>
              <p className="text-[10.5px] t-secondary leading-snug">{t.segment_detail.playbook}</p>
            </TreatStage>

            {/* 4 — Decision */}
            <TreatStage n={4} title="The decision" active={st>=4} tour="decision">
              <div className="text-center py-2 rounded-md mb-2" style={{background:sell?SOFT.green:'var(--surface-3)'}}>
                <div className="text-[20px] font-extrabold leading-none" style={{color:sell?COLORS.green:'var(--text-2)'}}>
                  {t.decision.toUpperCase()}
                </div>
              </div>
              <div className="relative h-2 rounded-full overflow-hidden mb-1" style={{background:'var(--surface-3)'}}>
                <div className="h-full rounded-full"
                  style={{width:st>=4?`${t.propensity*100}%`:'0%',background:sell?COLORS.green:COLORS.neutral,
                    transition:'width .9s cubic-bezier(.16,1,.3,1)'}}></div>
                <span className="absolute top-0 bottom-0 w-px" style={{left:`${t.threshold*100}%`,background:'#8f8f8f'}}></span>
              </div>
              <div className="flex justify-between mb-2">
                <span className="text-[10px] font-bold t-primary">{likely(t.propensity)} likely to buy</span>
                <span className="text-[10px] t-muted">line at {likely(t.threshold)}</span>
              </div>
              {t.override&&(
                <div className="rounded p-2 mb-2" style={{background:SOFT.red}}>
                  <p className="text-[10.5px] font-semibold leading-snug" style={{color:COLORS.red}}>{t.override}</p>
                </div>
              )}
              <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1">Safety checks</div>
              <div className="space-y-0.5 mb-2">
                {t.guardrails.map(g=>(
                  <div key={g.id} className="flex items-center gap-1.5" title={g.detail}>
                    <span className="w-3 h-3 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0"
                      style={{background:g.pass?SOFT.green:SOFT.red,color:g.pass?COLORS.green:COLORS.red}}>{g.pass?'✓':'✕'}</span>
                    <span className="text-[10.5px]" style={{color:g.pass?'var(--text-2)':COLORS.red}}>{g.name}</span>
                  </div>
                ))}
              </div>
              <p className="text-[10.5px] t-secondary leading-snug">{alt?t.rationale:(base.rationale)}</p>
            </TreatStage>

            {/* 5 — Routing */}
            <TreatStage n={5} title="Who takes the call" active={st>=5}>
              <KV k="Team" v={t.routing.skill}/>
              <KV k="Queue" v={t.routing.queue} mono/>
              {t.routing.translation&&<KV k="Translation" v={'Live · '+(LANGUAGE[t.routing.language]||t.routing.language)}/>}
              <div className="mt-2 pt-2 border-t divider">
                <p className="text-[10.5px] t-secondary leading-snug">{t.routing.why}</p>
              </div>
              {t.offer&&(
                <div className="mt-2 pt-2 border-t divider">
                  <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-0.5">Offer ready for the agent</div>
                  <div className="text-[11.5px] font-bold t-primary leading-tight">{t.offer.offer.to[0].product}</div>
                  <div className="mono text-[10.5px] font-bold" style={{color:COLORS.green}}>{t.offer.estimated_value} · {t.offer.type}</div>
                </div>
              )}
              {sc&&(
                <div className="mt-2 pt-2 border-t divider">
                  <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-0.5">Customer</div>
                  <div className="text-[11.5px] font-bold t-primary">{sc.customer.name}</div>
                  <div className="text-[10px] t-muted">{sc.customer.tier}</div>
                </div>
              )}
            </TreatStage>
          </div>

          {/* What-if switches */}
          <div className="mt-3 rounded-md p-3.5" style={{background:'var(--surface-2)',border:'1px solid var(--border)'}}>
            <div className="flex items-center gap-2 mb-2 flex-wrap">
              <span className="text-[11px] font-bold uppercase tracking-wider t-secondary">What if…</span>
              <span className="text-[11px] t-muted">change one thing about this customer, and the decision is made again</span>
              {alt&&(
                <button onClick={()=>{setSwitches([]);setAlt(null);}} className="ml-auto text-[11px] font-semibold px-2 py-0.5 rounded"
                  style={{background:'var(--surface-3)',color:'var(--text-2)'}}>Clear</button>
              )}
            </div>
            <div className="flex flex-wrap gap-1.5">
              {fd.whatifs.map(w=>{
                const on=switches.indexOf(w.id)>=0;
                return(
                  <button key={w.id} onClick={()=>toggle(w.id)}
                    className="text-[11.5px] font-semibold px-2.5 py-1.5 rounded-md transition-colors"
                    style={{background:on?COLORS.accent:'var(--surface)',color:on?'#fff':'var(--text-2)',
                      border:`1px solid ${on?COLORS.accent:'var(--border-strong)'}`}}>
                    {on?'✓ ':''}{w.label}
                  </button>
                );
              })}
            </div>
            {alt&&(
              <div className="mt-2.5 rounded p-2.5 slide-in-u flex items-center gap-3 flex-wrap"
                style={{background:alt.changed?SOFT.amber:'var(--surface)',border:`1px solid ${alt.changed?'#f2d9b0':'var(--border)'}`}}>
                <span className="text-[12px] font-bold" style={{color:alt.changed?COLORS.amber:'var(--text-2)'}}>
                  {alt.changed?'Decision changed':'Decision unchanged'}
                </span>
                <span className="text-[11.5px] t-secondary">
                  {alt.baseline.decision.toUpperCase()} · {likely(alt.baseline.propensity)} likely
                  {'  →  '}
                  <strong className="t-primary">{alt.decision.toUpperCase()} · {likely(alt.propensity)} likely</strong>
                </span>
                <span className="text-[11px] t-muted ml-auto">A rehearsal — the customer's record is not changed</span>
              </div>
            )}
          </div>

          {/* Outcome + feedback for this contact */}
          {!alt&&st>=6&&t.feedback&&(
            <div className="mt-3 rounded-md p-3.5 slide-in-u"
              style={{background:t.on_script===false?SOFT.amber:SOFT.accent,
                border:`1px solid ${t.on_script===false?'#f2d9b0':'#bcd7fb'}`}}>
              <div className="flex items-center gap-2 mb-2">
                <span className="text-[12px]">↩</span>
                <span className="text-[11px] font-bold uppercase tracking-wider" style={{color:COLORS.accent}}>
                  What happened next, and what the engine learned
                </span>
              </div>
              <div className="grid grid-cols-3 gap-4">
                <div>
                  <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-0.5">We expected</div>
                  <div className="text-[12.5px] font-semibold t-primary">{t.feedback.predicted}</div>
                </div>
                <div>
                  <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-0.5">What happened</div>
                  <div className="text-[12.5px] font-semibold t-primary">{t.feedback.actual}</div>
                </div>
                <div>
                  <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-0.5">What it taught us</div>
                  <div className="text-[12px] t-secondary leading-snug">{t.feedback.note}</div>
                </div>
              </div>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

// ─── Model & feedback: the model card, champion against challenger ───
function FrontierModel({fd,card,training,onTrain,onPromote,onReset,evaluation}){
  if(!card)return <EmptyState icon="clock" title="Loading…"/>;
  const ch=card.champion, cl=card.challenger;
  const maxW=Math.max.apply(null,ch.weights.map(w=>Math.abs(w.weight)));
  const ev=cl?cl.evaluation:null;
  const flips=cl?cl.demo_impact.filter(d=>d.flips):[];
  const better=(a,b,lowerIsBetter)=>lowerIsBetter?b<a:b>a;

  return(
    <>
      <div className="grid grid-cols-12 gap-4 mb-4">
        {/* Model card */}
        <div className="col-span-5 card">
          <div className="panel-head">
            <span className="panel-title">The engine in use · version {ch.version}</span>
            <span className="ml-auto text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded"
              style={{background:SOFT.green,color:COLORS.green}}>in use</span>
          </div>
          <div className="p-4">
            <div className="grid grid-cols-3 gap-2 mb-3.5 pb-3.5 border-b divider">
              {[['Kind','Logistic regression'],['Facts it weighs',ch.weights.length],['Sell line',likely(card.threshold)+' likely']].map(([l,v])=>(
                <div key={l}>
                  <div className="text-[10px] t-muted uppercase tracking-wide font-bold">{l}</div>
                  <div className="text-[12.5px] font-bold t-primary">{v}</div>
                </div>
              ))}
            </div>
            <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1.5">What makes a sale more likely, or less</div>
            <div className="space-y-1">
              {ch.weights.map(w=>{
                const up=w.weight>=0;
                return(
                  <div key={w.id} className="flex items-center gap-2">

                  {flips.length
                    ? flips.map(f=>f.name).join(', ')+' would be treated differently. The guided tour expects the original — reset before presenting.'

            </div>
          </div>

        {card.history.length>0&&(
          <div className="px-4 py-2.5 flex items-center gap-4 flex-wrap" style={{borderTop:'1px solid var(--border)',background:'var(--surface-2)'}}>
            <span className="text-[10px] t-muted uppercase tracking-wide font-bold">History</span>

                    <th key={i} className="text-left py-1.5 font-bold t-muted text-[10px] uppercase tracking-wide">{h}</th>

                </tr>

                {evaluation.rows.map(r=>(
                  <tr key={r.id} style={{borderBottom:'1px dashed var(--border)'}}>
                    <td className="py-1.5 font-semibold t-primary">{r.customer}</td>
                    <td className="py-1.5 mono t-secondary">{r.found} of {r.curated_signals}</td>
                    <td className="py-1.5 mono t-primary">{r.engine_score}</td>
                    <td className="py-1.5 mono t-muted">{r.curated_score}</td>
                    <td className="py-1.5 t-secondary">{r.engine_outcome}</td>
                    <td className="py-1.5 t-muted">{r.curated_outcome}</td>
                    <td className="py-1.5"><span className="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded"
                      style={{background:r.agree?SOFT.green:SOFT.red,color:r.agree?COLORS.green:COLORS.red}}>{r.agree?'agree':'differ'}</span></td>
                  </tr>
                ))}
              </tbody>
            </table>
            <p className="text-[11px] t-muted mt-3 leading-relaxed">
              The nine rehearsed calls show prepared analysis, so they land the same way every time. A different
              engine listens when the call is unscripted. This table is that engine reading the same nine calls.
              It was written with these calls in view, so agreement shows the two are consistent — it is not a
              measure of accuracy on conversations it has never heard. That needs real transcripts.
            </p>
          </div>
        </div>
      )}
    </>
  );
}

// ─── Digital Self Service Agent: answer, or hand over with context ───
function FrontierSelfService({voc}){
  const[q,setQ]=useState('');
  const[res,setRes]=useState(null);
  const[busy,setBusy]=useState(false);
  const ask=(text)=>{
    const v=(text||q).trim();
    if(!v)return;
    setQ(v);setBusy(true);
    fetch(API+'/selfservice/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:v})})
      .then(r=>r.json()).then(d=>{setRes(d);setBusy(false);}).catch(()=>setBusy(false));
  };
  const examples=['I forgot my password and can\'t sign in','How do I download an invoice for my accountant?',
    'The update keeps failing to install','I\'ve been charged twice this month','My colleague keeps getting signed out'];
  const d=voc?voc.deflection:null;
  return(
    <div className="grid grid-cols-12 gap-4">
      <div className="col-span-7 card">
        <div className="panel-head">
          <span className="panel-title">Before the contact · Digital Self Service Agent</span>
        </div>
        <div className="p-4">
          <p className="text-[12.5px] t-secondary leading-relaxed mb-3">
            Ask it anything a customer might. It answers from the knowledge base when it is confident and the task is
            one a customer can finish alone. Otherwise it hands over — and the agent starts with what it learned.
          </p>
          <div className="flex items-center gap-1.5 mb-2">
            <input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')ask();}}
