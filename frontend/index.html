<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Acme Customer Care — Agent Workspace</title>
<!-- All assets vendored locally — this demo runs with zero internet access. -->
<script src="vendor/tailwind.js"></script>
<script src="vendor/react.min.js"></script>
<script src="vendor/react-dom.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<link href="vendor/fonts.css" rel="stylesheet"/>
<style>
/* type-scale: v2 */
*{box-sizing:border-box;margin:0;padding:0}

/* ── DESIGN TOKENS ───────────────────────────────────────────────────
   A light theme. Change a value here and it changes everywhere.
     • Red (--brand) is reserved for the company mark and brand moments.
     • Blue (--accent) is the working accent of the interface.
   Layout and terminology follow the Amazon Connect agent workspace. */
:root{
  --bg:#f4f4f4;
  --surface:#ffffff;
  --surface-2:#fafafa;
  --surface-3:#f0f0f0;
  --border:#e1e1e1;
  --border-strong:#cacaca;

  --text:#131313;
  --text-2:#4b4b4b;
  --text-3:#8f8f8f;

  --brand:#eb1000;
  --brand-soft:#fff0ee;

  --accent:#0265dc;
  --accent-soft:#e6f0fe;

  --blue:#0265dc;      --blue-soft:#e6f0fe;
  --amber:#c4700c;     --amber-soft:#fdf1e0;
  --red:#d31510;       --red-soft:#ffece9;
  --green:#007a4d;     --green-soft:#e0f5ea;
  --purple:#893de7;    --purple-soft:#f2eafd;

  /* Agent workspace chrome sits darker than the content, as Connect's does. */
  --chrome:#1f2733;
  --chrome-2:#2b3543;
  --chrome-text:#e8edf4;
  --chrome-muted:#9dabbd;

  --shadow-sm:0 1px 3px rgba(19,19,19,.08),0 1px 2px rgba(19,19,19,.04);
  --shadow:0 2px 6px rgba(19,19,19,.07),0 6px 16px rgba(19,19,19,.05);
  --shadow-lg:0 4px 12px rgba(19,19,19,.08),0 16px 32px rgba(19,19,19,.09);
  --radius:8px;
}

body{
  font-family:'acme-clean','Source Sans 3','Source Sans Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;
}

::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cacaca;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b3b3b3;background-clip:content-box}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-2{background:var(--surface-2);border:1px solid var(--border);border-radius:6px}
.card-flat{background:var(--surface);border:1px solid var(--border);border-radius:6px}
.card-hover{transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s,border-color .2s}
.card-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
.divider{border-color:var(--border)}

.t-primary{color:var(--text)}
.t-secondary{color:var(--text-2)}
.t-muted{color:var(--text-3)}
.mono{font-family:'Source Code Pro',ui-monospace,'Cascadia Mono',monospace;font-variant-ligatures:none}

.section-title{display:flex;align-items:center;gap:.55rem;font-weight:700;color:var(--text)}
.section-title::before{content:'';width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,var(--accent),#5aa9f0)}

/* Panel header used across the workspace — dense, like Connect's */
.panel-head{display:flex;align-items:center;gap:.5rem;padding:.6rem .85rem;border-bottom:1px solid var(--border);background:var(--surface-2);border-radius:7px 7px 0 0}
.panel-title{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--text-2)}

button,a{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

@keyframes signal-flash{0%{opacity:0;transform:translateY(9px) scale(.97)}60%{opacity:1;transform:translateY(0) scale(1.005)}100%{opacity:1;transform:translateY(0) scale(1)}}
.signal-enter{animation:signal-flash .45s cubic-bezier(.16,1,.3,1) both}

@keyframes typing{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.typing-dot{animation:typing 1.4s infinite;display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin:0 2px}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}

@keyframes slide-in-r{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
.slide-in-r{animation:slide-in-r .4s cubic-bezier(.16,1,.3,1) both}
@keyframes slide-in-u{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.slide-in-u{animation:slide-in-u .42s cubic-bezier(.16,1,.3,1) both}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.fade-in{animation:fade-in .4s ease both}

@keyframes gauge-fill{from{stroke-dashoffset:251}to{stroke-dashoffset:var(--offset)}}
.gauge-circle{animation:gauge-fill 1s cubic-bezier(.16,1,.3,1) forwards}

@keyframes celebrate{0%{opacity:0;transform:scale(.88) translateY(10px)}55%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
.celebrate{animation:celebrate .5s cubic-bezier(.16,1,.3,1) both}

@keyframes live-blink{0%,100%{opacity:1}50%{opacity:.25}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:live-blink 1.1s infinite}

/* Incoming-contact ring — the CCP alert */
@keyframes ring-pulse{0%{box-shadow:0 0 0 0 rgba(2,101,220,.35)}70%{box-shadow:0 0 0 12px rgba(2,101,220,0)}100%{box-shadow:0 0 0 0 rgba(2,101,220,0)}}
.ring-pulse{animation:ring-pulse 1.5s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.shake{animation:shake .5s ease-in-out infinite}

@keyframes sheen{0%{background-position:-160% 0}100%{background-position:260% 0}}
.sheen::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);
  background-size:200% 100%;animation:sheen 2.2s infinite}

@keyframes pop-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.pop-in{animation:pop-in .28s cubic-bezier(.16,1,.3,1) both}

@keyframes confetti{0%{opacity:1;transform:translate(0,0) rotate(0) scale(1)}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(.4)}}
.confetti{position:absolute;width:8px;height:8px;border-radius:2px;animation:confetti 1.5s cubic-bezier(.16,1,.3,1) forwards}

/* The thing the tour is pointing at */
@keyframes tour-pulse{0%,100%{outline-offset:3px;outline-color:rgba(2,101,220,.95)}
  50%{outline-offset:9px;outline-color:rgba(2,101,220,.35)}}
.tour-focus{position:relative;z-index:2;border-radius:10px;
  outline:3px solid rgba(2,101,220,.95);outline-offset:3px;
  animation:tour-pulse 1.7s ease-in-out 4}
input[type=range]{accent-color:var(--accent)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="root"></div>
<script>window.BRAND_PACK=/*BRAND_JSON*/null/*END*/;</script>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

// ─── CONSTANTS ───
const API=window.location.origin+'/api';
const BRAND='#eb1000';
const COLORS={accent:'#0265dc',blue:'#0265dc',amber:'#c4700c',red:'#d31510',green:'#007a4d',purple:'#893de7',neutral:'#6e6e6e'};
const SOFT={accent:'#e6f0fe',blue:'#e6f0fe',amber:'#fdf1e0',red:'#ffece9',green:'#e0f5ea',purple:'#f2eafd',neutral:'#f0f0f0'};
const FILL={accent:'#2680eb',blue:'#2680eb',amber:'#e68619',green:'#009a5a',purple:'#9d64f5',neutral:'#b3b3b3'};

const TYPE_TONE={
  'Upsell':'blue','Cross-Sell':'amber','New Sale':'purple','Retention':'green',
  'No Action':'neutral','Suppressed':'red',
  'Upsell + Cross-Sell':'blue','New Product Sale':'purple',
  expansion:'blue',upsell:'blue',cross_sell:'amber',new_product:'purple',
};
const toneOf=(k)=>TYPE_TONE[k]||'neutral';
const c=(t)=>COLORS[t]||COLORS.accent;
const cs=(t)=>SOFT[t]||SOFT.accent;
const cf=(t)=>FILL[t]||FILL.accent;

const money=(n)=>{
  const v=Number(n)||0;
  if(v>=1000000)return '$'+(v/1000000).toFixed(1).replace(/\.0$/,'')+'M';
  if(v>=10000)return '$'+Math.round(v/1000)+'K';
  return '$'+v.toLocaleString();
};
const parseMoney=(s)=>parseInt(String(s||'').replace(/[^0-9]/g,''),10)||0;
// Playback pacing. Deliberately slow: the presenter narrates over the conversation,
// so a turn takes ~9s at 1x rather than the ~5s that felt brisk but unusable live.
const BASE_TYPING=2600, BASE_GAP=6200;
const clock=(sec)=>`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;

// ─── SPEECH ───
// Audio is synthesised by the browser from the transcript — there is no recording. It
// uses whatever voices the operating system provides, and works offline.
const canSpeak=()=>typeof window!=='undefined'&&'speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
const stopSpeaking=()=>{try{if(canSpeak())window.speechSynthesis.cancel();}catch(e){}};
const pickVoice=(lang,role)=>{
  const all=window.speechSynthesis.getVoices()||[];
  const pre=lang.slice(0,2).toLowerCase();
  let pool=all.filter(v=>v.lang&&v.lang.toLowerCase().replace('_','-')===lang.toLowerCase());
  if(!pool.length)pool=all.filter(v=>v.lang&&v.lang.toLowerCase().startsWith(pre));
  if(!pool.length)return null;
  // Two different voices where the system has them, so the speakers can be told apart.
  return role==='agent'?pool[0]:pool[pool.length>1?1:0];
};
const say=(text,lang,role,rate)=>new Promise(resolve=>{
  let done=false;
  const finish=()=>{if(!done){done=true;resolve();}};
  try{
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(lang,role);
    if(v)u.voice=v;
    u.lang=lang;u.rate=Math.max(0.7,Math.min(1.9,rate));
    u.pitch=role==='agent'?0.95:1.08;
    u.onend=finish;u.onerror=finish;
    window.speechSynthesis.speak(u);
    // Some engines never fire onend. Allow reading time, then move on regardless.
    setTimeout(finish,Math.max(3500,text.length*95/Math.max(0.7,rate)));
  }catch(e){finish();}
});
// A translated turn is heard twice: as it was said, then as the other party hears it.
const speak=(msg,speed)=>{
  const rate=1.02*(speed||1);
  const own=msg.lang==='es'?'es-ES':'en-GB';
  const other=msg.text_en||msg.text_translated;
  const otherLang=msg.text_en?'en-GB':'es-ES';
  let p=say(msg.text,own,msg.role,rate);
  if(other)p=p.then(()=>say(other,otherLang,msg.role==='agent'?'customer':'agent',rate*1.06));
  return p;
};
const speechInput=()=>typeof window!=='undefined'&&(window.SpeechRecognition||window.webkitSpeechRecognition)||null;

// Agent states, as Amazon Connect models them.
const AGENT_STATES={
  available:{label:'Available',tone:'green'},
  ringing:{label:'Incoming Contact',tone:'accent'},
  connected:{label:'On Contact',tone:'accent'},
  acw:{label:'After Contact Work',tone:'amber'},
  offline:{label:'Offline',tone:'neutral'},
};

// ═══════════════════════════════════════════════════════════════════════════
//  PRIMITIVES
// ═══════════════════════════════════════════════════════════════════════════

function BrandMark({size=26}){
  // Drawn from the brand pack. The shipped mark is a placeholder, not anybody's logo.
  const L=(window.BRAND_PACK&&window.BRAND_PACK.logo)||{viewBox:'0 0 100 100',shapes:[{d:'M50 6 92 30v40L50 94 8 70V30z'}]};
  const vb=(L.viewBox||'0 0 100 100').split(' ').map(Number);
  return(
    <svg width={size} height={size*(vb[3]/vb[2])} viewBox={L.viewBox} role="img" aria-label="Company mark" className="shrink-0">
      {(L.shapes||[]).map((s,i)=><path key={i} d={s.d} fill={s.fill||BRAND}/>)}
    </svg>
  );
}

// The delivery partner, set in type. The name and colour come from the brand pack.
function PartnerMark({size=30}){
  const P=(window.BRAND_PACK&&window.BRAND_PACK.partner)||{};
  return(
    <div className="flex items-center gap-2.5 shrink-0" aria-label="Globex Consulting Services">
      <div className="rounded flex items-center justify-center px-2.5"
        style={{height:size,background:P.colour||'#1f3a5f'}}>
        <span className="font-extrabold text-white tracking-tight"
          style={{fontSize:size*0.5,letterSpacing:'-0.02em'}}>Globex</span>
      </div>
      <div className="leading-tight">
        <div className="text-[11px] font-bold t-primary">Globex Consulting Services</div>
        <div className="text-[10px] t-muted uppercase tracking-wider">Delivery partner</div>
      </div>
    </div>
  );
}

function NavIcon({name,size=19}){
  const paths={
    workspace:<><path d="M4 12a6.5 6.5 0 1113 0"/><rect x="2.5" y="11.5" width="3.5" height="6" rx="1.6"/><rect x="15" y="11.5" width="3.5" height="6" rx="1.6"/><path d="M18.5 17.5v.4a2.6 2.6 0 01-2.6 2.6H12"/></>,
    pipeline:<><rect x="2.5" y="3" width="4.6" height="15" rx="1.3"/><rect x="9.7" y="3" width="4.6" height="10.5" rx="1.3"/><rect x="16.9" y="3" width="3.6" height="6.5" rx="1.3"/></>,
    analytics:<><path d="M3 18V9.5M9 18V3.5M15 18v-6"/><path d="M2 18h18"/></>,
    executive:<><path d="M2.5 16.5l5-5.5 4 3.5 6.5-7.5"/><path d="M13.5 6.5h5v5"/><path d="M2.5 19.5h18"/></>,
    architecture:<><rect x="2.5" y="2.5" width="16" height="4.2" rx="1.2"/><rect x="2.5" y="8.4" width="16" height="4.2" rx="1.2"/><rect x="2.5" y="14.3" width="16" height="4.2" rx="1.2"/></>,
    frontdoor:<><path d="M4.5 19V3.6a1 1 0 011.2-1l8 -1.4a1 1 0 011.3 1V19"/><path d="M2.5 19h17"/><circle cx="12.4" cy="10.6" r="1" fill="currentColor" stroke="none"/></>,
  };
  return(
    <svg width={size} height={size} viewBox="0 0 21 21" fill="none" stroke="currentColor"
      strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" className="shrink-0">
      {paths[name]}
    </svg>
  );
}

function Pill({tone='accent',children,className='',dot=false}){
  return(
    <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wider ${className}`}
      style={{background:cs(tone),color:c(tone)}}>
      {dot&&<span className="w-1.5 h-1.5 rounded-full" style={{background:c(tone)}}></span>}
      {children}
    </span>
  );
}

function Gauge({value,size=78,tone='accent',caption}){
  const r=40,circ=2*Math.PI*r,pct=Math.max(0,Math.min(100,value)),offset=circ-circ*(pct/100);
  return(
    <svg width={size} height={size} viewBox="0 0 100 100" role="img" aria-label={`${caption||'Score'}: ${pct} of 100`}>
      <circle cx="50" cy="50" r={r} fill="none" stroke="#e8edf4" strokeWidth="9"/>
      <circle cx="50" cy="50" r={r} fill="none" stroke={c(tone)} strokeWidth="9" strokeLinecap="round"
        strokeDasharray={circ} style={{'--offset':offset,strokeDashoffset:251}}
        className="gauge-circle" transform="rotate(-90 50 50)"/>
      <text x="50" y="49" textAnchor="middle" fill={c(tone)} fontSize="25" fontWeight="800" fontFamily="Source Sans 3, sans-serif">{pct}</text>
      <text x="50" y="64" textAnchor="middle" fill="#8f8f8f" fontSize="9" fontWeight="600" fontFamily="Source Sans 3, sans-serif">/ 100</text>
    </svg>
  );
}

function EmptyState({icon,title,body,compact}){
  return(
    <div className={`text-center px-4 ${compact?'py-6':'py-9'}`}>
      <div className="mb-2.5 flex justify-center" style={{color:'#c4c4c4'}}>
        {ICONS[icon]?<Icon name={icon} size={30} stroke={1.5}/>:<span className="text-2xl">{icon}</span>}
      </div>
      <p className="text-[13px] font-semibold t-secondary mb-1">{title}</p>
      {body&&<p className="text-[12px] t-muted leading-relaxed max-w-[230px] mx-auto">{body}</p>}
    </div>
  );
}

function Confetti(){
  const bits=Array.from({length:26},(_,i)=>{
    const angle=(i/26)*Math.PI*2, dist=90+((i*37)%110);
    const palette=[COLORS.accent,COLORS.green,COLORS.amber,COLORS.purple,BRAND];
    return{tx:`${Math.cos(angle)*dist}px`,ty:`${Math.sin(angle)*dist-40}px`,
      rot:`${(i%2?1:-1)*(180+i*11)}deg`,color:palette[i%palette.length],delay:(i%6)*0.035};
  });
  return(
    <div className="absolute inset-0 pointer-events-none overflow-visible" aria-hidden="true">
      {bits.map((b,i)=>(
        <span key={i} className="confetti" style={{left:'50%',top:'42%',background:b.color,
          '--tx':b.tx,'--ty':b.ty,'--rot':b.rot,animationDelay:`${b.delay}s`}}></span>
      ))}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
//  APPLICATION SHELL — icons, top bar, navigation
// ═══════════════════════════════════════════════════════════════════════════

// One drawn icon set, so nothing on screen depends on how a machine renders emoji.
const ICONS={
  home:<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>,
  route:<><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6h7M6 8.5v3a4 4 0 0 0 4 4h5.5"/></>,
  headset:<><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="13" width="4.5" height="7" rx="2"/><rect x="17" y="13" width="4.5" height="7" rx="2"/></>,
  target:<><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></>,
  dollar:<path d="M12 2.5v19M16.5 7.6c0-1.9-2-3.1-4.5-3.1S7.5 5.6 7.5 7.7c0 4.6 9.3 2.3 9.3 7 0 2.1-2.1 3.3-4.8 3.3s-4.8-1.2-4.8-3.3"/>,
  chart:<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>,
  trend:<><path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/></>,
  layers:<><path d="M12 3 2.5 8 12 13l9.5-5z"/><path d="M2.5 12.5 12 17.5l9.5-5M2.5 17 12 22l9.5-5"/></>,
  cpu:<><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9.5 2.5V6M14.5 2.5V6M9.5 18v3.5M14.5 18v3.5M2.5 9.5H6M2.5 14.5H6M18 9.5h3.5M18 14.5h3.5"/></>,
  phone:<path d="M5 3.5h3.2l1.6 4.2-2 1.4a12 12 0 0 0 5.1 5.1l1.4-2 4.2 1.6V17a2.5 2.5 0 0 1-2.7 2.5A16.5 16.5 0 0 1 2.5 6.2 2.5 2.5 0 0 1 5 3.5z"/>,
  chat:<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-5 4v-4.3A2.5 2.5 0 0 1 4 13.5z"/>,
  mic:<><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></>,
  user:<><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>,
  users:<><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></>,
  shield:<><path d="M12 2.5 4 5.5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10v-6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></>,
  check:<path d="m4.5 12.5 5 5 10-11"/>,
  play:<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>,
  pause:<path d="M8 5v14M16 5v14"/>,
  refresh:<><path d="M20 11a8 8 0 1 0-2.3 6.2"/><path d="M20 4.5V11h-6.5"/></>,
  volume:<><path d="M4 9.5h3l5-4v13l-5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></>,
  globe:<><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></>,
  search:<><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></>,
  bulb:<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>,

function PipelineRail({routed,triage,signalCount,leadScore,coaching,leadCaptured,resolution,started}){
  const decided=!!triage;
  const S=(state,label,sub)=>({state,label,sub});
  const engineState=(active,done)=>{
    if(decided&&!routed)return 'skipped';
    if(done)return 'done';
    if(active)return 'active';
    return 'pending';
  };
  const groups=[
    {group:'THE CALL',items:[S(started?'done':'pending','Call arrives','with the customer\'s record')]},
    {group:'THE ENGINE',items:[
      S(decided?'done':(started?'active':'pending'),'Solve or sell?',decided?(routed?'sell':'solve'):'deciding'),
      S(engineState(true,signalCount>0),'Buying signals',decided&&!routed?'not needed':`${signalCount} heard`),
      S(engineState(leadScore>=55,leadScore>=80),'The right offer',decided&&!routed?'not needed':(leadScore>=80?'found':'looking')),
      S(engineState(!!coaching,!!coaching),'Guiding the agent',decided&&!routed?'service only':(coaching?'advice given':'standing by')),
    ]},
    {group:'THE RESULT',items:[
      S(leadCaptured||resolution?'done':'pending',
        leadCaptured?'Lead captured':(resolution?'Resolved':'In progress'),
        leadCaptured?'sent to sales':(resolution?'no offer made':'on the call')),
    ]},
  ];
  const dot=(s)=>{
    if(s==='done')return{bg:'var(--accent)',fg:'#fff',bd:'var(--accent)',ch:'✓'};
    if(s==='active')return{bg:'var(--accent-soft)',fg:'var(--accent)',bd:'var(--accent)',ch:'●'};
    if(s==='skipped')return{bg:'transparent',fg:'#b3b3b3',bd:'#dcdcdc',ch:'–'};
    return{bg:'var(--surface-3)',fg:'#b3b3b3',bd:'var(--border)',ch:''};
  };
  return(
    <div className="card px-3.5 py-2 mb-2.5">
      <div className="flex items-center gap-2.5 overflow-x-auto">
        {groups.map((g,gi)=>(
          <React.Fragment key={g.group}>
            <div className="shrink-0">
              <div className="text-[10px] font-bold uppercase tracking-[.09em] t-muted mb-1 pl-0.5">{g.group}</div>
              <div className="flex items-center gap-1.5">
                {g.items.map((s,si)=>{
                  const d=dot(s.state), muted=s.state==='pending'||s.state==='skipped';
                  return(
                    <React.Fragment key={s.label}>
                      {si>0&&<span className="text-[11px] shrink-0" style={{color:'#cfcfcf'}}>→</span>}
                      <div className="flex items-center gap-1.5 shrink-0">
                        <span className="w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0"
                          style={{background:d.bg,color:d.fg,border:`1px solid ${d.bd}`,borderStyle:s.state==='skipped'?'dashed':'solid'}}>{d.ch}</span>
                        <div className="leading-tight">
                          <div className="text-[11.5px] font-semibold whitespace-nowrap"
                            style={{color:muted?'#a5a5a5':'var(--text)',textDecoration:s.state==='skipped'?'line-through':'none'}}>{s.label}</div>
                          <div className="text-[10px] whitespace-nowrap" style={{color:muted?'#c0c0c0':'var(--text-3)'}}>{s.sub}</div>
                        </div>
                      </div>
                    </React.Fragment>
                  );
                })}
              </div>
            </div>
            {gi<groups.length-1&&<span className="shrink-0 self-end pb-1.5 px-0.5 text-[14px]" style={{color:'#c4c4c4'}}>❯</span>}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

function TriageCard({triage,threshold=0.55}){
  if(!triage)return(
    <div className="card">
      <div className="panel-head"><span className="panel-title">The decision · Customer Frontier</span></div>
      <div className="p-3.5 flex items-center gap-2">
        <span className="typing-dot"></span><span className="typing-dot"></span><span className="typing-dot"></span>
        <span className="text-[12px] t-muted ml-1">Deciding: solve, or sell…</span>
      </div>
    </div>
  );
  const routed=triage.decision==='growth_engine', suppressed=!!triage.suppression;
  const tone=suppressed?'red':(routed?'accent':'neutral');
  const pct=Math.round(triage.propensity*100);
  const label=suppressed?'Held back · no offer':(routed?'Sell · worth a conversation':'Solve · nothing to sell');
  return(
    <div className="card slide-in-r" style={{borderColor:suppressed?'#f5c6c2':(routed?'#bcd7fb':'var(--border)')}}>
      <div className="panel-head" style={{background:cs(tone)}}>
        <span className="panel-title" style={{color:c(tone)}}>{label}</span>
        <span className="text-[12.5px] font-extrabold ml-auto" style={{color:c(tone)}}>{pct}%</span>
      </div>
      <div className="p-3.5">
        <div className="relative h-2 rounded-full overflow-hidden mb-1.5" style={{background:'var(--surface-3)'}}>
          <div className="h-full rounded-full" style={{width:`${pct}%`,background:c(tone),transition:'width .8s cubic-bezier(.16,1,.3,1)'}}></div>
          <span className="absolute top-0 bottom-0 w-px" style={{left:`${threshold*100}%`,background:'#8f8f8f'}}></span>
        </div>
        <div className="flex justify-between mb-2.5">
          <span className="text-[10px] t-muted font-semibold">Unlikely to buy</span>
          <span className="text-[10px] font-bold t-secondary">line at {Math.round(threshold*100)}%</span>
          <span className="text-[10px] t-muted font-semibold">Very likely</span>
        </div>
        <p className="text-[12.5px] t-secondary leading-relaxed">{triage.reason}</p>
        {suppressed&&(
          <div className="mt-2.5 p-2.5 rounded" style={{background:SOFT.red}}>
            <p className="text-[12px] font-semibold leading-relaxed" style={{color:COLORS.red}}>
              Likely to buy — and still held back. Selling to a customer with an unresolved problem is
              how you lose them.
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

function SignalBadge({signal,index}){
  const tone=toneOf(signal.category)||toneOf(signal.type);
  const conf=Math.round((signal.confidence||0)*100);
  return(
    <div className="signal-enter card-flat p-3 mb-2" style={{animationDelay:`${index*0.07}s`,borderLeft:`3px solid ${c(tone)}`}}>
      <div className="flex items-start justify-between gap-2 mb-1.5">
        <Pill tone={tone}>{signal.category||signal.type}</Pill>
        <div className="text-right shrink-0">
          <div className="mono text-[12px] font-bold" style={{color:c(tone)}}>{conf}%</div>
          <div className="text-[10px] t-muted font-medium">confidence</div>
        </div>
      </div>
      <p className="text-[13px] t-primary leading-relaxed font-medium">{signal.signal}</p>
      <div className="mt-2 h-1 rounded-full overflow-hidden" style={{background:'#eef2f7'}}>
        <div className="h-full rounded-full" style={{width:`${conf}%`,background:c(tone),transition:'width .8s cubic-bezier(.16,1,.3,1)'}}></div>
      </div>
      {signal.keywords&&signal.keywords.length>0&&(
        <div className="flex flex-wrap gap-1 mt-2">
          {signal.keywords.map((k,i)=>(
            <span key={i} className="mono text-[10.5px] px-1.5 py-0.5 rounded t-secondary" style={{background:'var(--surface-3)'}}>“{k}”</span>
          ))}
        </div>
      )}
    </div>
  );
}

function CoachingCard({coaching}){
  const[open,setOpen]=useState(null);
  useEffect(()=>{setOpen(null);},[coaching&&coaching.suggestion]);
  if(!coaching)return null;
  const toneByPriority={critical:'red',high:'amber',medium:'blue',low:'green'};
  const tone=toneByPriority[coaching.priority]||'accent';
  const sources=coaching.sources||[];
  const shown=sources.find(s=>s.id===open);
  return(
    <div className="slide-in-r card-flat p-3.5" style={{borderLeft:`3px solid ${c(tone)}`}}>
      <div className="flex items-center justify-between gap-2 mb-2">
        <span className="text-[11.5px] font-bold uppercase tracking-wider t-secondary">Advice to the agent</span>
        <Pill tone={tone} dot>{coaching.priority}</Pill>
      </div>
      <p className="text-[13.5px] t-primary leading-relaxed">{coaching.suggestion}</p>
      {(coaching.type||sources.length>0)&&(
        <div className="mt-2.5 pt-2.5 border-t divider">
          {coaching.type&&<span className="text-[10.5px] t-muted font-medium uppercase tracking-wide">{coaching.type}</span>}
          {sources.length>0&&(
            <div className="mt-1.5">
              <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1">Based on</div>
              <div className="space-y-1">
                {sources.map(s=>(
                  <button key={s.id} onClick={()=>setOpen(open===s.id?null:s.id)} title="Read the article"
                    className="w-full text-left text-[11.5px] font-semibold px-2 py-1 rounded flex items-center gap-1.5"
                    style={{background:open===s.id?SOFT.accent:'var(--surface-3)',color:open===s.id?COLORS.accent:'var(--text-2)'}}>
                    <Icon name="book" size={12}/><span className="truncate">{s.title}</span>
                  </button>
                ))}
              </div>
              {shown&&(
                <div className="mt-1.5 p-2 rounded fade-in" style={{background:'var(--surface-2)',border:'1px solid var(--border)'}}>
                  <div className="text-[11px] font-bold t-primary leading-tight mb-0.5">{shown.title}</div>
                  <p className="text-[11px] t-secondary leading-snug">{shown.body}</p>
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════
//  MAIN APP
// ═══════════════════════════════════════════════════════════════════════════
function App(){
  const[page,setPage]=useState('home');
  // Shell: menu, text size, and the tour's presentation state
  const[navClosed,setNavClosed]=useState(false);
  const[scaleChoice,setScaleChoice]=useState(()=>{
    try{const v=parseFloat(localStorage.getItem('icx-scale'));return v>=0.8&&v<=1.8?v:null;}catch(e){return null;}
  });
  const[fitScale,setFitScale]=useState(1);
  const[notes,setNotes]=useState(()=>{try{return localStorage.getItem('icx-notes')==='1';}catch(e){return false;}});
  const[chapter,setChapter]=useState(null);       // the chapter card on screen, if any
  const[barHeight,setBarHeight]=useState(96);
  const[techTab,setTechTab]=useState('platform');
  const chapterTimer=useRef(null);
  const lastActRef=useRef(null);
  const[scenarios,setScenarios]=useState([]);
  const[leads,setLeads]=useState([]);
  const[analytics,setAnalytics]=useState(null);
  const[workspace,setWorkspace]=useState(null);
  const[execData,setExecData]=useState(null);
  const[story,setStory]=useState(null);
  const[storyIdx,setStoryIdx]=useState(-1);      // -1 = not running
  const[showLauncher,setShowLauncher]=useState(false);
  const[fd,setFd]=useState(null);
  const[fdSelected,setFdSelected]=useState('aisha-storage-full');
  const[fdStage,setFdStage]=useState(0);
  const fdTimer=useRef(null);
  const[arch,setArch]=useState(null);
  const[archStep,setArchStep]=useState(-1);      // -1 = not tracing; exactly one focus at a time
  const[archPlaying,setArchPlaying]=useState(false);
  const[archDetail,setArchDetail]=useState(false);
  const[archSelected,setArchSelected]=useState(null);
  const traceTimer=useRef(null);
  const runTraceRef=useRef(null);
  const[aiEnabled,setAiEnabled]=useState(false);

  // Frontier: tabs, live traffic, model, platform
  const[fdTab,setFdTab]=useState('overview');
  const[feed,setFeed]=useState(null);
  const[modelCard,setModelCard]=useState(null);
  const[training,setTraining]=useState(false);
  const[platformInfo,setPlatformInfo]=useState(null);
  const[voc,setVoc]=useState(null);
  const[evaluation,setEvaluation]=useState(null);

  // Per-contact: the customer's profile, the wrap-up result, the live contact
  const[profile360,setProfile360]=useState(null);
  const[wrap,setWrap]=useState(null);
  const[leadSummary,setLeadSummary]=useState(null);
  const[liveOpen,setLiveOpen]=useState(false);
  const[liveOptions,setLiveOptions]=useState(null);
  const[replies,setReplies]=useState([]);
  const[liveSentiments,setLiveSentiments]=useState([]);
  const[liveBusy,setLiveBusy]=useState(false);
  const[audioOn,setAudioOn]=useState(false);
  const audioOnRef=useRef(false);
  audioOnRef.current=audioOn;
  // Bumped whenever playback is restarted or stopped, so a speech callback from an
  // earlier run can never advance the current one.
  const runId=useRef(0);

  // Contact / agent state
  const[agentState,setAgentState]=useState('available');
  const[activeScenario,setActiveScenario]=useState(null);
  const[seconds,setSeconds]=useState(0);
  const[acwSeconds,setAcwSeconds]=useState(0);
  const[muted,setMuted]=useState(false);
  // Playback pace. 1x is the presenter default — slow enough to narrate over.
  const[playSpeed,setPlaySpeed]=useState(1);
  const playSpeedRef=useRef(1);
  playSpeedRef.current=playSpeed;
  const[held,setHeld]=useState(false);
  const[disposition,setDisposition]=useState(null);

  // Analysis state
  const[messages,setMessages]=useState([]);
  const[isTyping,setIsTyping]=useState(false);
  const[typingWho,setTypingWho]=useState('');
  const[isPlaying,setIsPlaying]=useState(false);
  const[signals,setSignals]=useState([]);
  const[coaching,setCoaching]=useState(null);
  const[leadScore,setLeadScore]=useState(0);
  const[sentiment,setSentiment]=useState(0.5);
  const[leadCaptured,setLeadCaptured]=useState(false);
  const[showCelebration,setShowCelebration]=useState(false);
  const[aiLive,setAiLive]=useState(null);
  const[triage,setTriage]=useState(null);
  const[resolution,setResolution]=useState(null);

  const playTimer=useRef(null);
  const chatRef=useRef(null);
  // Refs mirror state for the setTimeout playback chain, whose callbacks close over
  // one render — reading state there would always see stale values.
  const leadCapturedRef=useRef(false);
  const leadScoreRef=useRef(0);
  const signalsRef=useRef([]);
  const turnRef=useRef(0);
  const scenarioRef=useRef(null);
  const ringTimer=useRef(null);

  useEffect(()=>{
    const q=new URLSearchParams(window.location.search);
    fetch(API+'/health').then(r=>r.json()).then(d=>setAiEnabled(d.ai_enabled)).catch(()=>{});
    fetch(API+'/scenarios').then(r=>r.json()).then(setScenarios).catch(()=>{});
    fetch(API+'/workspace').then(r=>r.json()).then(setWorkspace).catch(()=>{});
    fetch(API+'/executive').then(r=>r.json()).then(setExecData).catch(()=>{});
    fetch(API+'/architecture').then(r=>r.json()).then(setArch).catch(()=>{});
    // ?story=1 opens the guided demo; ?story=4 resumes at step 4.
    const wantStep=q.get('story');
    fetch(API+'/story').then(r=>r.json()).then(d=>{
      setStory(d);
      if(wantStep){setShowLauncher(false);setTimeout(()=>goToStepRef.current&&goToStepRef.current(Math.max(0,parseInt(wantStep,10)-1)),400);}
    }).catch(()=>{});
    if(q.get('page')||q.get('scenario')||q.get('story')||q.get('live'))setShowLauncher(false);  // deep links skip the launcher
    // ?page=frontdoor&contact=<id> opens the treatment walkthrough on that contact.
    const wanted=q.get('contact')||'aisha-storage-full';
    const storyDriving=!!q.get('story');
    fetch(API+'/frontdoor').then(r=>r.json()).then(d=>{
      setFd(d);
      if(!storyDriving)setTimeout(()=>runTreatmentRef.current&&runTreatmentRef.current(wanted),600);
    }).catch(()=>{});
    refreshLeads();
    fetch(API+'/frontier/model').then(r=>r.json()).then(setModelCard).catch(()=>{});
    fetch(API+'/platform').then(r=>r.json()).then(setPlatformInfo).catch(()=>{});
    fetch(API+'/voc').then(r=>r.json()).then(setVoc).catch(()=>{});
    fetch(API+'/evaluation').then(r=>r.json()).then(setEvaluation).catch(()=>{});
    fetch(API+'/live/options').then(r=>r.json()).then(setLiveOptions).catch(()=>{});
    const deep=q.get('scenario'), pg=q.get('page');
    // ?page=frontdoor&tab=model opens a Frontier tab; ?live=1 opens the live-contact launcher.
    const tb=q.get('tab');
    const tech=tb==='model'||tb==='platform';
    if(tb&&['overview','treatment','selfservice'].includes(tb))setFdTab(tb);
    else if(q.get('contact'))setFdTab('treatment');
    if(tech)setTechTab(tb);
    if(q.get('live')){setPage('workspace');setTimeout(()=>setLiveOpen(true),500);}
    if(deep)setTimeout(()=>routeContact(deep),400);
    // Model and platform used to be Frontier tabs. Old links still land in the right place.
    else if(tech&&(pg==='frontdoor'||pg==='technology'))setPage('technology');
    else if(pg&&PAGE_IDS.includes(pg))setPage(pg);
    // ?page=architecture&trace=1 opens the map with the contact trace already running.
    // ?page=architecture&trace=1 auto-plays; &trace=5 jumps to step 5 and holds.
    const tr=q.get('trace');
    if(pg==='architecture'&&tr)setTimeout(()=>{
      const n=parseInt(tr,10);
      if(n>1&&archJumpRef.current)archJumpRef.current(n-1);
      else if(runTraceRef.current)runTraceRef.current();
    },900);
  },[]);

  // Text size. Fits the screen it is shown on — a meeting-room display gets larger type
  // than a laptop — unless the presenter has chosen a size.
  useEffect(()=>{
    const fit=()=>setFitScale(Math.max(1,Math.min(1.6,
      Math.round(Math.min(window.innerWidth/1560,window.innerHeight/840)*20)/20)));
    fit();
    window.addEventListener('resize',fit);
    return()=>window.removeEventListener('resize',fit);
  },[]);
  const scale=scaleChoice||fitScale;
  const setScale=(v)=>{
    setScaleChoice(v);
    try{if(v)localStorage.setItem('icx-scale',String(v));else localStorage.removeItem('icx-scale');}catch(e){}
  };
  const toggleNotes=(v)=>{
    setNotes(v);
    try{localStorage.setItem('icx-notes',v?'1':'0');}catch(e){}
  };

  // Talk timer while connected; ACW timer during wrap-up.
  useEffect(()=>{
    if(agentState!=='connected')return;
    const t=setInterval(()=>setSeconds(s=>s+1),1000);
    return()=>clearInterval(t);
  },[agentState]);
  useEffect(()=>{
    if(agentState!=='acw')return;
    const t=setInterval(()=>setAcwSeconds(s=>s+1),1000);
    return()=>clearInterval(t);
  },[agentState]);

  const refreshLeads=()=>{
    fetch(API+'/leads').then(r=>r.json()).then(setLeads).catch(()=>{});
    fetch(API+'/analytics').then(r=>r.json()).then(setAnalytics).catch(()=>{});
  };

  // Everything computed from the Frontier model. Re-read after the model changes.
  const refreshFrontier=()=>{
    fetch(API+'/frontdoor').then(r=>r.json()).then(setFd).catch(()=>{});
    fetch(API+'/scenarios').then(r=>r.json()).then(setScenarios).catch(()=>{});
    fetch(API+'/frontier/model').then(r=>r.json()).then(setModelCard).catch(()=>{});
    fetch(API+'/story').then(r=>r.json()).then(setStory).catch(()=>{});
    fetch(API+'/voc').then(r=>r.json()).then(setVoc).catch(()=>{});
    fetch(API+'/executive').then(r=>r.json()).then(setExecData).catch(()=>{});
    fetch(API+'/evaluation').then(r=>r.json()).then(setEvaluation).catch(()=>{});
    fetch(API+'/analytics').then(r=>r.json()).then(setAnalytics).catch(()=>{});
  };
  const trainModel=async()=>{
    setTraining(true);
    try{await fetch(API+'/frontier/model/train',{method:'POST'});}catch(e){}
    fetch(API+'/frontier/model').then(r=>r.json()).then(setModelCard).catch(()=>{});
    setTraining(false);
  };
  const promoteModel=async()=>{
    try{await fetch(API+'/frontier/model/promote',{method:'POST'});}catch(e){}
    refreshFrontier();
  };
  const resetModel=async()=>{
    try{await fetch(API+'/frontier/model/reset',{method:'POST'});}catch(e){}
    refreshFrontier();
  };

  // Live traffic: contacts arriving on the Frontier, polled while that screen is open.
  useEffect(()=>{
    if(page!=='frontdoor'||fdTab!=='overview')return;
    let stop=false;
    const pull=()=>fetch(API+'/frontier/feed').then(r=>r.json()).then(d=>{if(!stop)setFeed(d);}).catch(()=>{});
    pull();
    const t=setInterval(pull,3000);
    return()=>{stop=true;clearInterval(t);};
  },[page,fdTab]);
  // Queue metrics move with the simulated arrivals.
  useEffect(()=>{
    if(page!=='workspace')return;
    const t=setInterval(()=>fetch(API+'/workspace').then(r=>r.json()).then(setWorkspace).catch(()=>{}),15000);
    return()=>clearInterval(t);
  },[page]);

  const loadProfile=(key)=>fetch(API+'/profiles/'+key).then(r=>r.ok?r.json():null).then(setProfile360).catch(()=>{});

  const resetContactState=()=>{
    clearTimeout(playTimer.current);clearTimeout(ringTimer.current);
    runId.current++;stopSpeaking();
    setMessages([]);setSignals([]);setCoaching(null);setLeadScore(0);setSentiment(0.5);
    setLeadCaptured(false);setShowCelebration(false);setAiLive(null);
    setTriage(null);setResolution(null);setDisposition(null);
    setSeconds(0);setAcwSeconds(0);setMuted(false);setHeld(false);
    setWrap(null);setLeadSummary(null);setReplies([]);setLiveSentiments([]);setProfile360(null);
    leadCapturedRef.current=false;leadScoreRef.current=0;signalsRef.current=[];turnRef.current=0;
  };

  // ── Contact lifecycle: route → ring → accept → connected → end → ACW → close
  const routeContact=async(id)=>{
    resetContactState();
    const sc=await (await fetch(API+'/scenarios/'+id)).json();
    scenarioRef.current=sc;
    setActiveScenario(sc);
    // Restore the customer to their state before the call, then read the profile.
    fetch(API+'/contacts/'+id+'/start',{method:'POST'}).then(()=>loadProfile(id)).catch(()=>{});
    setPage('workspace');
    setAgentState('ringing');
    // Auto-answer, as most consumer voice routing profiles are configured.
    ringTimer.current=setTimeout(()=>acceptContact(),3200);
  };

  // An unscripted contact: nothing is played back, the conversation is whatever is said.
  const startLive=async(opts)=>{
    resetContactState();
    setLiveOpen(false);setLiveBusy(true);
    try{
      const res=await fetch(API+'/live/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(opts)});
      const sc=await res.json();
      scenarioRef.current=sc;
      setActiveScenario(sc);
      loadProfile(sc.profile_id);
      setTriage(sc.triage);
      setLeadScore(sc.opening.lead_score);leadScoreRef.current=sc.opening.lead_score;
      setCoaching(sc.opening.coaching);setReplies(sc.opening.suggested_replies||[]);
      setPage('workspace');
      setAgentState('ringing');
      ringTimer.current=setTimeout(()=>acceptContact(),2200);
    }catch(e){}
    setLiveBusy(false);
  };
  const sendLive=async(role,text)=>{
    const sc=scenarioRef.current;
    if(!sc||!sc.live||!text||!text.trim())return;
    const msg={role,text:text.trim(),delay:seconds};
    setMessages(prev=>[...prev,msg]);
    setTimeout(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},80);
    setLiveBusy(true);
    try{
      const res=await fetch(API+'/live/turn',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({session_id:sc.id,role,text:msg.text})});
      if(res.ok)applyAnalysis(sc,await res.json());
    }catch(e){}
    setLiveBusy(false);
  };

  const acceptContact=()=>{
    clearTimeout(ringTimer.current);
    setAgentState('connected');
    if(scenarioRef.current&&scenarioRef.current.live)return;
    setTimeout(()=>playFrom(0),700);
  };
  const rejectContact=()=>{
    clearTimeout(ringTimer.current);clearTimeout(playTimer.current);
    runId.current++;stopSpeaking();
    setAgentState('available');setActiveScenario(null);scenarioRef.current=null;
  };
  const endContact=()=>{
    clearTimeout(playTimer.current);
    runId.current++;stopSpeaking();
    setIsPlaying(false);setIsTyping(false);
    setAgentState('acw');
  };
  const closeContact=()=>{
    setAgentState('available');setActiveScenario(null);scenarioRef.current=null;
    setMessages([]);setSignals([]);setCoaching(null);setTriage(null);setResolution(null);
    setSeconds(0);setAcwSeconds(0);setDisposition(null);setWrap(null);setReplies([]);
    refreshLeads();
    fetch(API+'/frontier/model').then(r=>r.json()).then(setModelCard).catch(()=>{});
  };

  const playFrom=(startTurn)=>{
    const sc=scenarioRef.current;
    if(!sc||sc.live)return;
    clearTimeout(playTimer.current);
    const run=++runId.current;
    turnRef.current=startTurn;
    setIsPlaying(true);
    const step=()=>{
      if(run!==runId.current)return;
      const t=turnRef.current;
      if(t>=sc.conversation.length){
        setIsPlaying(false);setIsTyping(false);
        // Wrap-up begins shortly after the conversation completes.
        playTimer.current=setTimeout(()=>{if(run===runId.current)setAgentState('acw');},4200/(playSpeedRef.current||1));
        return;
      }
      const msg=sc.conversation[t];
      const sp=playSpeedRef.current||1;
      setIsTyping(true);setTypingWho(msg.role);
      playTimer.current=setTimeout(()=>{
        if(run!==runId.current)return;
        setIsTyping(false);
        setMessages(prev=>[...prev,msg]);
        analyzeAtTurn(sc,t);
        setTimeout(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},100);
        turnRef.current=t+1;
        if(audioOnRef.current&&canSpeak()){
          // With audio on, the turn lasts as long as it takes to say.
          speak(msg,playSpeedRef.current||1).then(()=>{
            if(run!==runId.current)return;
            playTimer.current=setTimeout(step,900/(playSpeedRef.current||1));
          });
        }else{
          playTimer.current=setTimeout(step,BASE_GAP/(playSpeedRef.current||1));
        }
      },BASE_TYPING/sp);
    };
    step();
  };
  const pausePlayback=()=>{clearTimeout(playTimer.current);runId.current++;stopSpeaking();setIsPlaying(false);setIsTyping(false);};
  const togglePlayback=()=>{isPlaying?pausePlayback():playFrom(turnRef.current);};
  const replayContact=()=>{
    const sc=scenarioRef.current;
    if(!sc)return;
    if(sc.live)startLive({customer:'random'});else routeContact(sc.id);
  };

  // ── After Contact Work: score the contact, write the outcome back, trigger what follows.
  const submitWrap=(disp)=>{
    const sc=scenarioRef.current;
    if(!sc)return;
    fetch(API+'/contacts/'+sc.id+'/wrapup',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({disposition:disp||null,lead_captured:leadCapturedRef.current,
        talk_seconds:seconds,signals:signalsRef.current.length,turns:Math.max(1,turnRef.current||messages.length)})})
      .then(r=>r.ok?r.json():null).then(d=>{
        if(!d)return;
        setWrap(d);
        loadProfile(sc.profile_id||sc.id);
      }).catch(()=>{});
  };
  useEffect(()=>{if(agentState==='acw')submitWrap(disposition);},[agentState,disposition]);

  const applyAnalysis=(sc,data)=>{
    if(data.signals){setSignals(data.signals);signalsRef.current=data.signals;}
    if(data.suggested_replies)setReplies(data.suggested_replies);
    if(data.sentiments)setLiveSentiments(data.sentiments);
    if(data.coaching)setCoaching(data.coaching);
    setAiLive(data.ai||null);
    if(data.ai&&data.ai.coaching_suggestion){
      setCoaching({suggestion:data.ai.coaching_suggestion,priority:data.ai.coaching_priority||'high',type:'claude live'});
    }
    if(data.triage)setTriage(data.triage);
    if(data.resolution_summary)setResolution(data.resolution_summary);
    const score=data.lead_score||0;
    setLeadScore(score);leadScoreRef.current=score;
    setSentiment(typeof data.sentiment==='number'?data.sentiment:0.5);
    if(score>=80&&!leadCapturedRef.current&&data.lead_summary){
      leadCapturedRef.current=true;                    // latch synchronously — no duplicates
      setTimeout(()=>captureLead(sc,data.lead_summary),1000);
    }
  };

  const analyzeAtTurn=async(sc,turnIdx)=>{
    try{
      const res=await fetch(API+'/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({scenario_id:sc.id,turn_index:turnIdx})});
      if(!res.ok)throw new Error('analyze failed: '+res.status);
      applyAnalysis(sc,await res.json());
    }catch(e){
      // Backend unreachable — drive from the payload the browser already holds.
      const a=sc.ai_analysis;
      const i=Math.min(turnIdx,a.lead_score_progression.length-1);
      const cc=a.coaching_suggestions.filter(x=>x.turn<=turnIdx);
      const routed=sc.triage.decision==='growth_engine';
      const lastTurn=turnIdx>=sc.conversation.length-1;
      applyAnalysis(sc,{
        signals:a.signals.filter(s=>s.turn<=turnIdx),
        coaching:cc.length?cc[cc.length-1]:null,
        lead_score:a.lead_score_progression[i],
        sentiment:a.sentiment_progression[i],
        triage:turnIdx>=sc.triage.turn?sc.triage:null,
        lead_summary:(routed&&a.lead_score_progression[i]>=80)?a.lead_summary:null,
        resolution_summary:(!routed&&lastTurn)?a.resolution_summary:null,
        ai:null,
      });
    }
  };

  const captureLead=async(sc,summaryIn)=>{
    const summary=summaryIn||sc.ai_analysis.lead_summary;
    setLeadSummary(summary);
    setLeadCaptured(true);setShowCelebration(true);
    try{
      await fetch(API+'/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
        scenario_id:sc.id,customer_name:sc.customer.name,company:sc.customer.company,
        lead_type:summary.type,lead_score:leadScoreRef.current||90,
        confidence:summary.confidence||0.9,summary:summary.recommended_action,
        signals:JSON.stringify(signalsRef.current),coaching:summary.urgency,
        estimated_value:summary.estimated_value
      })});
      refreshLeads();
    }catch(e){}
    setTimeout(()=>setShowCelebration(false),4200);
  };

  // Reveals the Intelligent Customer Frontier treatment stage by stage: IVR -> model -> segment -> decision -> route.
  const runTreatment=(id)=>{
    clearTimeout(fdTimer.current);
    if(id)setFdSelected(id);
    setFdStage(0);
    let n=0;
    const step=()=>{
      n++;
      setFdStage(n);
      if(n<6)fdTimer.current=setTimeout(step,900);
    };
    fdTimer.current=setTimeout(step,300);
  };
  const runTreatmentRef=useRef(null);
  runTreatmentRef.current=runTreatment;
  useEffect(()=>()=>clearTimeout(fdTimer.current),[]);

  // Walks the contact path one component at a time. Focus is derived from archStep,
  // so exactly one component is ever highlighted — accumulating them destroyed focus.
  const archGoTo=(i)=>{
    if(!arch)return;
    if(i<0||i>=arch.trace.length){setArchPlaying(false);return;}
    setArchStep(i);setArchSelected(null);
    setTimeout(()=>{
      const el=document.querySelector('[data-arch-id="'+arch.trace[i].target+'"]');
      if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    },90);
  };
  const archStart=()=>{setArchPlaying(true);archGoTo(0);};
  const archStop=()=>{clearTimeout(traceTimer.current);setArchPlaying(false);setArchStep(-1);};
  const archNext=()=>{setArchPlaying(false);archGoTo(archStep+1);};
  const archPrev=()=>{setArchPlaying(false);archGoTo(archStep-1);};
  const archTogglePlay=()=>setArchPlaying(p=>!p);

  useEffect(()=>{
    clearTimeout(traceTimer.current);
    if(!archPlaying||archStep<0||!arch)return;
    if(archStep>=arch.trace.length-1){setArchPlaying(false);return;}
    traceTimer.current=setTimeout(()=>archGoTo(archStep+1),2600);
    return()=>clearTimeout(traceTimer.current);
  },[archPlaying,archStep,arch]);

  const runTrace=archStart;   // guided demo step 8 still calls runTrace()
  const archJumpRef=useRef(null);
  archJumpRef.current=(i)=>{setArchPlaying(false);archGoTo(i);};

  useEffect(()=>()=>clearTimeout(traceTimer.current),[]);

  // Executes one story step: navigate, and trigger whatever that screen needs to show.
  // Entering a new chapter shows its title card first; the screen behind it starts once
  // the card has cleared, so nothing plays unseen.
  const CARD_MS=2600;
  const dismissChapter=()=>{
    clearTimeout(chapterTimer.current);
    setChapter(c=>c?{...c,leaving:true}:c);
    chapterTimer.current=setTimeout(()=>setChapter(null),450);
  };
  const goToStep=(i,opts)=>{
    if(!story||i<0||i>=story.steps.length)return;
    const st=story.steps[i];
    const acts=actsOf(story);
    const newAct=st.act!==lastActRef.current;
    const card=newAct&&!(opts&&opts.quiet);
    lastActRef.current=st.act;
    const wait=card?CARD_MS-500:0;
    if(card){
      clearTimeout(chapterTimer.current);
      setChapter({step:st,chapter:acts.findIndex(a=>a.act===st.act)+1,chapters:acts.length,leaving:false});
      chapterTimer.current=setTimeout(dismissChapter,CARD_MS-450);
    }
    setStoryIdx(i);
    setPage(st.page);
    setLiveOpen(false);
    if(st.page==='frontdoor')setFdTab(st.tab||(st.contact?'treatment':'overview'));
    if(st.page==='technology')setTechTab(st.tab||'platform');
    if(st.page==='frontdoor'&&st.contact)setTimeout(()=>runTreatment(st.contact),150+wait);
    if(st.page==='workspace'&&st.scenario)setTimeout(()=>routeContact(st.scenario),150+wait);
    // The unscripted step: clear whatever contact is open and offer the launcher.
    if(st.page==='workspace'&&st.live)setTimeout(()=>{
      if(scenarioRef.current){resetContactState();setAgentState('available');setActiveScenario(null);scenarioRef.current=null;}
      setLiveOpen(true);
    },200+wait);
    if(st.page==='architecture'&&st.trace)setTimeout(()=>runTrace(),400+wait);
    // Bring the thing the presenter is pointing at into view.
    if(st.scroll)setTimeout(()=>{
      const el=document.getElementById(st.scroll);
      if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    },450);
    else if(!st.focus)setTimeout(()=>{
      const main=document.querySelector('main .overflow-y-auto')||document.querySelector('main');
      if(main&&main.scrollTo)main.scrollTo({top:0,behavior:'smooth'});
    },250);
  };

  // Draw the eye. While a step is active, whatever it names is ringed — as soon as it
  // exists, since some of it (a wrap-up panel) only appears once a call has finished.
  const focusKey=storyIdx>=0&&story&&story.steps[storyIdx]?story.steps[storyIdx].focus:null;
  useEffect(()=>{
    const clear=()=>document.querySelectorAll('.tour-focus').forEach(e=>e.classList.remove('tour-focus'));
    clear();
    if(!focusKey)return;
    let found=false;
    const look=()=>{
      const el=document.querySelector('[data-tour="'+focusKey+'"]');
      if(!el){found=false;return;}
      if(el.classList.contains('tour-focus'))return;
      clear();
      el.classList.add('tour-focus');
      if(!found){found=true;el.scrollIntoView({behavior:'smooth',block:'center'});}
    };
    const first=setTimeout(look,chapter?CARD_MS:500);
    const t=setInterval(look,700);
    return()=>{clearTimeout(first);clearInterval(t);clear();};
  },[focusKey,storyIdx,page]);
  const goToStepRef=useRef(null);
  goToStepRef.current=goToStep;
  const startStory=()=>{setShowLauncher(false);lastActRef.current=null;goToStep(0);};
  const jumpStory=(i)=>{setShowLauncher(false);lastActRef.current=null;goToStep(i);};
  const exitStory=()=>{
    setStoryIdx(-1);setShowLauncher(false);lastActRef.current=null;
    clearTimeout(chapterTimer.current);setChapter(null);
  };

  useEffect(()=>{
    if(storyIdx<0)return;
    const onKey=(e)=>{
      // Arrow keys belong to whoever is typing — the live contact has a text box.
      const tag=e.target&&e.target.tagName;
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
      if(e.key==='ArrowRight'||e.key==='PageDown')goToStep(storyIdx+1);
      else if(e.key==='ArrowLeft'||e.key==='PageUp')goToStep(storyIdx-1);
      else if(e.key==='n'||e.key==='N')toggleNotes(!notes);
      else if(e.key==='Escape')exitStory();
    };
    window.addEventListener('keydown',onKey);
    return()=>window.removeEventListener('keydown',onKey);
  },[storyIdx,story,notes]);

  const contact=activeScenario?activeScenario.contact:null;

  const storyRunning=storyIdx>=0;
  // On a live contact the menu folds away: the agent's desktop needs the width.
  const onContact=page==='workspace'&&agentState!=='available';
  const navCollapsed=navClosed||onContact;
  return(
    <div className="flex flex-col"
      style={{zoom:scale,height:`calc(100vh / ${scale})`,width:`calc(100vw / ${scale})`,
        paddingBottom:storyRunning?barHeight:0}}>
      {showLauncher&&story&&<StoryLauncher story={story} onStart={startStory} onJump={jumpStory}
        onExplore={()=>setShowLauncher(false)}/>}
      {liveOpen&&<LiveLauncher options={liveOptions} onStart={startLive} onClose={()=>setLiveOpen(false)} busy={liveBusy}/>}
      {chapter&&<ChapterCard step={chapter.step} chapter={chapter.chapter} chapters={chapter.chapters}
        leaving={chapter.leaving} onDismiss={dismissChapter}/>}
      {storyRunning&&<PresenterBar story={story} idx={storyIdx} notes={notes} setNotes={toggleNotes}
        onPrev={()=>goToStep(storyIdx-1)} onNext={()=>goToStep(storyIdx+1)}
        onExit={exitStory} onJump={goToStep} onOpenList={()=>setShowLauncher(true)} onHeight={setBarHeight}/>}
      <TopBar page={page} agent={workspace?workspace.agent:null} agentState={agentState} workspace={workspace}
        onTour={()=>setShowLauncher(true)} storyRunning={storyRunning}
        scale={scale} setScale={setScale} autoScale={!scaleChoice} onMenu={()=>setNavClosed(v=>!v)}/>
      <div className="flex-1 flex min-h-0">
        <SideNav page={page} setPage={setPage} collapsed={navCollapsed} leads={leads.length}/>
        {page==='workspace'&&(
          <CCP agentState={agentState} contact={contact} scenario={activeScenario} seconds={seconds}
            acwSeconds={acwSeconds} onAccept={acceptContact} onReject={rejectContact}
            onEnd={endContact} onClose={closeContact}
            muted={muted} setMuted={setMuted} held={held} setHeld={setHeld}/>
        )}
        <main className="flex-1 min-w-0 min-h-0 overflow-hidden flex flex-col">
          {page==='home'&&<div className="flex-1 overflow-y-auto p-6">
            <HomePage exec={execData} fd={fd} scenarios={scenarios} arch={arch} story={story}
              onTour={startStory} onRoute={routeContact} onLive={()=>{setPage('workspace');setLiveOpen(true);}}
              setPage={setPage}/>
          </div>}
          {page==='technology'&&<div className="flex-1 overflow-y-auto p-5">
            <TechnologyPage fd={fd} tab={techTab} setTab={setTechTab} modelCard={modelCard} training={training}
              onTrain={trainModel} onPromote={promoteModel} onReset={resetModel}
              platformInfo={platformInfo} evaluation={evaluation}/>
          </div>}
          {page==='workspace'&&(
            agentState==='available'
              ? <QueueView scenarios={scenarios} onRoute={routeContact} workspace={workspace} analytics={analytics} leads={leads} aiEnabled={aiEnabled}
                  onLive={()=>setLiveOpen(true)}/>
              : <ContactView scenario={activeScenario} contact={contact} agentState={agentState}
                  messages={messages} isTyping={isTyping} typingWho={typingWho} chatRef={chatRef}
                  signals={signals} coaching={coaching} leadScore={leadScore} sentiment={sentiment}
                  triage={triage} resolution={resolution} leadCaptured={leadCaptured}
                  showCelebration={showCelebration} aiLive={aiLive} aiEnabled={aiEnabled}
                  seconds={seconds} isPlaying={isPlaying} togglePlayback={togglePlayback}
                  replayContact={replayContact} workspace={workspace}
                  disposition={disposition} setDisposition={setDisposition} execData={execData}
                  playSpeed={playSpeed} setPlaySpeed={setPlaySpeed}
                  profile={profile360} wrap={wrap} leadSummary={leadSummary}
                  replies={replies} liveSentiments={liveSentiments} liveBusy={liveBusy} sendLive={sendLive}
                  audioOn={audioOn} setAudioOn={(v)=>{if(!v)stopSpeaking();setAudioOn(v);}}/>
          )}
          {page==='pipeline'&&<div className="flex-1 overflow-y-auto p-5"><PipelinePage leads={leads} refreshLeads={refreshLeads}/></div>}
          {page==='analytics'&&<div className="flex-1 overflow-y-auto p-5"><AnalyticsPage analytics={analytics} leads={leads} voc={voc}/></div>}
          {page==='executive'&&<div className="flex-1 overflow-y-auto p-5"><ExecutivePage exec={execData}/></div>}
          {page==='frontdoor'&&<div className="flex-1 overflow-y-auto p-5">
            <FrontDoorPage fd={fd} scenarios={scenarios} selectedId={fdSelected}
              setSelectedId={setFdSelected} stage={fdStage} runTreatment={runTreatment}
              tab={fdTab} setTab={setFdTab} feed={feed} voc={voc}/>
          </div>}
          {page==='architecture'&&<div className="flex-1 overflow-y-auto p-5">
            <ArchitecturePage arch={arch} step={archStep} playing={archPlaying}
              detail={archDetail} setDetail={setArchDetail}
              selected={archSelected} setSelected={setArchSelected}
              onStart={archStart} onStop={archStop} onPrev={archPrev} onNext={archNext}
              onTogglePlay={archTogglePlay} onJump={archGoTo}/>
          </div>}
        </main>
      </div>
    </div>
  );
}

// Numbers count up once, when they first appear. Reduced-motion users get the number.
function useCountUp(target,ms=1100){
  const[v,setV]=useState(0);
  useEffect(()=>{
    if(typeof target!=='number'){setV(target);return;}
    const still=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(still){setV(target);return;}
    let raf=0;const t0=performance.now();
    const tick=(now)=>{
      const k=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-k,3);
      setV(target*e);
      if(k<1)raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    // A background tab never fires animation frames — make sure the figure lands anyway.
    const safety=setTimeout(()=>setV(target),ms+400);
    return()=>{cancelAnimationFrame(raf);clearTimeout(safety);};
  },[target]);
  return v;
}

function BigNumber({value,format,label,note,tag,tone='accent',icon}){
  const v=useCountUp(value);
  return(
    <div className="card p-6 flex items-start gap-4">
      <IconTile name={icon} tone={tone} size={46}/>
      <div className="min-w-0 flex-1">
        <div className="flex items-baseline gap-2 flex-wrap">
          <span className="text-[40px] font-extrabold leading-none tracking-tight" style={{color:c(tone)}}>{format(v)}</span>
          {tag&&<span className="text-[10.5px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded"
            style={{background:SOFT.amber,color:COLORS.amber}}>{tag}</span>}
        </div>
        <div className="text-[15px] font-bold t-primary mt-2 leading-tight">{label}</div>
        <div className="text-[13px] t-secondary mt-1 leading-snug">{note}</div>
      </div>
    </div>
  );
}

// ─── Live contact: what the customer (or the agent) says next ───
function LiveComposer({onSend,replies,busy}){
  const[role,setRole]=useState('customer');
  const[text,setText]=useState('');
  const[listening,setListening]=useState(false);
  const rec=useRef(null);
  const Speech=speechInput();

  const send=(r,t)=>{
    const v=(t||'').trim();
    if(!v)return;
    onSend(r,v);
    setText('');
    // A conversation alternates. Offer the other speaker next.
    setRole(r==='customer'?'agent':'customer');
  };
  const listen=()=>{
    if(!Speech)return;
    if(listening&&rec.current){rec.current.stop();return;}
    try{
      const r=new Speech();
      r.lang='en-GB';r.interimResults=true;r.continuous=false;
      r.onresult=(e)=>{
        let s='';
        for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;
        setText(s);
      };
      r.onend=()=>setListening(false);
      r.onerror=()=>setListening(false);
      rec.current=r;setListening(true);r.start();
    }catch(e){setListening(false);}
  };
  useEffect(()=>()=>{try{if(rec.current)rec.current.abort();}catch(e){}},[]);

  return(
    <div className="shrink-0 p-2.5" style={{borderTop:'1px solid var(--border)',background:'var(--surface)'}}>
      {replies&&replies.length>0&&role==='agent'&&(
        <div className="mb-2">
          <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1">Suggested replies · click to say</div>
          <div className="space-y-1">
            {replies.map((r,i)=>(
              <button key={i} onClick={()=>send('agent',r)} disabled={busy}
                className="w-full text-left text-[11.5px] leading-snug px-2 py-1.5 rounded transition-colors"
                style={{background:SOFT.accent,color:'#0b4ea8',border:'1px solid #cfe0fb'}}>{r}</button>
            ))}
          </div>
        </div>
      )}
      <div className="flex items-center gap-1.5 mb-1.5">
        <span className="flex items-center rounded overflow-hidden" style={{border:'1px solid var(--border)'}}>
          {[['customer','Customer'],['agent','Agent']].map(([k,l])=>(
            <button key={k} onClick={()=>setRole(k)} className="text-[11px] font-bold px-2 py-1"
              style={{background:role===k?(k==='customer'?COLORS.accent:'var(--text-2)'):'var(--surface)',
                color:role===k?'#fff':'var(--text-3)'}}>{l}</button>
          ))}
        </span>
        <span className="text-[10.5px] t-muted">says…</span>
        {busy&&<span className="ml-auto text-[10.5px] t-muted">analysing…</span>}
      </div>
      <div className="flex items-end gap-1.5">
        <textarea value={text} onChange={e=>setText(e.target.value)} rows={2}
          onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(role,text);}}}
          placeholder={role==='customer'?'e.g. My storage is full and I have a shoot on Saturday':'What the agent says'}
          className="flex-1 text-[13px] leading-snug px-2.5 py-2 rounded-md resize-none"
          style={{border:'1px solid var(--border-strong)',background:'var(--surface-2)',color:'var(--text)',fontFamily:'inherit',outline:'none'}}/>
        {Speech&&(
          <button onClick={listen}
            title="Speak instead of typing. Uses the browser's speech service, which may send audio to the browser vendor."
            className={`w-9 h-9 rounded-md text-[14px] shrink-0 ${listening?'ring-pulse':''}`}
            style={{background:listening?SOFT.red:'var(--surface-3)',color:listening?COLORS.red:'var(--text-2)'}}>
            {listening?'■':<Icon name="mic" size={16}/>}
          </button>
        )}
        <button onClick={()=>send(role,text)} disabled={!text.trim()}
          className="h-9 px-3.5 rounded-md text-[13px] font-bold text-white shrink-0"
          style={{background:COLORS.accent,opacity:text.trim()?1:0.45}}>Send</button>
      </div>
    </div>
  );
}

    const tone=pct>=92?'red':pct>=75?'amber':'accent';
    return(
      <div key={label} className="mb-2">
        <div className="flex items-center justify-between">
          <span className="text-[11px] t-secondary">{label}</span>

      ):(
        <div className="p-3 space-y-3">
          <div>
            <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1.5">Groups this customer belongs to</div>
            <div className="flex flex-wrap gap-1">
              {profile.audiences.length===0&&<span className="text-[11px] t-muted">None</span>}
              {profile.audiences.map(a=>{
                const tone=a.id==='service-recovery'||a.id==='marketing-opt-out'?'red':'accent';
                return <span key={a.id} title={a.description} className="text-[10.5px] font-semibold px-1.5 py-0.5 rounded"
                  style={{background:cs(tone),color:c(tone)}}>{a.name}</span>;

            </div>
          </div>

          <div className="card-flat p-2.5">
            <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-2">Usage</div>
            {meter('Cloud storage',u.storageUsedPct||0,`${u.storageUsedPct||0}% of ${u.storageQuotaGb>=1000?(u.storageQuotaGb/1000)+'TB':u.storageQuotaGb+'GB'}`)}
            {meter('Generative credits',u.generativeCreditsUsedPct||0)}
            <div className="grid grid-cols-3 gap-2 mt-2.5">
              {[['Apps used',`${u.appsUsed30d} of ${u.appsEntitled}`],['Users',`${u.distinctUsers30d} on ${e.seats} seat${e.seats===1?'':'s'}`],
                ['Trend',(u.usageTrendPct>0?'+':'')+u.usageTrendPct+'%']].map(([l,v])=>(
                <div key={l}>
                  <div className="text-[10px] t-muted">{l}</div>
                  <div className="text-[11.5px] font-bold t-primary">{v}</div>

              <div className="text-[10px] t-muted uppercase tracking-wide font-bold mb-1.5">Service</div>
              <div className="text-[11.5px] font-bold" style={{color:s.openCaseCount?COLORS.red:'var(--text)'}}>
                {s.openCaseCount?`${s.openCaseCount} open · ${s.openCases.join(', ')}`:'No open cases'}
              </div>

// ─── Transcript pieces (Contact Lens style) ───
function Utterance({msg,idx,sentiment}){
  const isCustomer=msg.role==='customer';
  const s=typeof sentiment==='number'?sentiment:0.5;
  const tone=s>=0.7?'green':s>=0.4?'amber':'red';
  const other=msg.text_en||msg.text_translated;
  return(
    <div className="signal-enter mb-3">
      <div className="flex items-center gap-2 mb-1">
        <span className="text-[11px] font-bold" style={{color:isCustomer?COLORS.accent:'var(--text-2)'}}>
          {isCustomer?'Customer':'Agent'}
        </span>
        <span className="mono text-[10px] t-muted">{clock(msg.delay||0)}</span>
        {msg.lang&&other&&<span className="mono text-[10px] font-bold uppercase t-muted">{msg.lang}</span>}
        {isCustomer&&(
          <span className="text-[10px] font-bold uppercase tracking-wide px-1.5 rounded" style={{background:cs(tone),color:c(tone)}}>
            {s>=0.7?'positive':s>=0.4?'neutral':'negative'}
          </span>
        )}
      </div>
      <div className="px-3 py-2 text-[13.5px] leading-relaxed rounded-md"
        style={{background:isCustomer?'var(--surface)':'var(--accent-soft)',
          border:`1px solid ${isCustomer?'var(--border)':'#cfe0fb'}`,color:'var(--text)'}}>
        {msg.text}
        {other&&(
          <div className="mt-1.5 pt-1.5 text-[12.5px] leading-relaxed" style={{borderTop:'1px dashed #d9c8f5',color:COLORS.purple}}>
            <span className="mono text-[10px] font-bold uppercase mr-1.5">{msg.text_en?'en':'es'}</span>{other}
          </div>
        )}
      </div>
    </div>
  );
}

function TypingRow({who}){
  return(
    <div className="fade-in mb-3">
      <div className="text-[11px] font-bold mb-1" style={{color:who==='customer'?COLORS.accent:'var(--text-2)'}}>
        {who==='customer'?'Customer':'Agent'}
      </div>
      <div className="px-3 py-2.5 rounded-md inline-flex items-center gap-0.5"
        style={{background:'var(--surface)',border:'1px solid var(--border)'}}>
        <span className="typing-dot"></span><span className="typing-dot"></span><span className="typing-dot"></span>
      </div>
    </div>
  );
}

function ScoreCard({title,value,tone,status,threshold,thresholdLabel,sheen}){
  const pct=Math.max(0,Math.min(100,value)), passed=pct>=threshold;
  return(
    <div className="card p-3.5">
      <div className="flex items-center gap-3 mb-3">
        <Gauge value={pct} size={72} tone={tone} caption={title}/>
        <div className="min-w-0">
          <div className="text-[12.5px] font-bold t-primary mb-0.5">{title}</div>
          <div className="text-[12px] font-semibold" style={{color:c(tone)}}>{status}</div>
        </div>
      </div>
      <div className="relative h-2 rounded-full overflow-hidden" style={{background:'var(--surface-3)'}}>
        <div className={`h-full rounded-full relative ${sheen?'sheen':''}`}
          style={{width:`${pct}%`,background:c(tone),transition:'width .9s cubic-bezier(.16,1,.3,1)'}}></div>
        <span className="absolute top-0 bottom-0 w-px" style={{left:`${threshold}%`,background:passed?'rgba(255,255,255,.85)':'var(--border-strong)'}}></span>
      </div>
      <div className="flex justify-between mt-1">
        <span className="mono text-[10px] t-muted font-semibold">0</span>
        <span className="mono text-[10px] font-bold" style={{color:passed?c(tone):'var(--text-3)'}}>{thresholdLabel} {threshold}</span>
        <span className="mono text-[10px] t-muted font-semibold">100</span>
      </div>
    </div>
  );
}


// Offer catalogue tones — a cross-cloud recommendation should read as a boundary crossing.
const CLOUD_TONE={'Studio Cloud':'red','Docs Cloud':'neutral','Engage Cloud':'purple'};

function OfferStrip({offer}){
  if(!offer)return null;
  const ft=CLOUD_TONE[offer.from.cloud]||'neutral';
  return(
    <div className="mt-2.5 pt-2.5 border-t divider">
      <div className="flex items-center justify-between gap-2 mb-1.5">
        <span className="text-[10px] t-muted uppercase tracking-wide font-bold">The offer</span>
        {offer.crosses_cloud&&(
          <span className="text-[10px] font-bold uppercase tracking-wide px-1.5 py-0.5 rounded"
            style={{background:SOFT.purple,color:COLORS.purple}}>across clouds</span>
        )}
      </div>
      <div className="flex items-center gap-1.5 mb-1">
        <span className="text-[11px] t-secondary line-through truncate">{offer.from.product}</span>
        <span className="text-[10px] px-1 rounded shrink-0" style={{background:cs(ft),color:c(ft)}}>{offer.from.cloud}</span>
      </div>
      {offer.to.map((o,i)=>{
        const t=CLOUD_TONE[o.cloud]||'neutral';
        return(
          <div key={i} className="flex items-center gap-1.5 mb-1">
            <span className="text-[11px] shrink-0" style={{color:COLORS.green}}>→</span>
            <span className="text-[11.5px] font-bold t-primary truncate">{o.product}</span>
            <span className="text-[10px] px-1 rounded shrink-0" style={{background:cs(t),color:c(t)}}>{o.cloud}</span>
            {o.phase&&<span className="text-[10px] t-muted shrink-0">{o.phase}</span>}
          </div>
        );
      })}
      {offer.note&&<p className="text-[10.5px] t-muted leading-snug mt-1.5">{offer.note}</p>}
    </div>
  );
}

// ─── Sales & Service Quality Agent: the scorecard ───
function QualityCard({q}){
  const[open,setOpen]=useState(false);
  const all=q.sections.reduce((a,x)=>a.concat(x.criteria),[]);
  const met=all.filter(x=>x.pass).length;
  const tone=q.compliance==='breach'?'red':q.overall>=90?'green':q.overall>=75?'accent':'amber';
  return(
    <section className="col-span-5 card slide-in-u">
      <div className="panel-head">
        <span className="panel-title">How well the call was handled</span>
        <span className="ml-auto text-[10px] t-muted">{q.agent}</span>
      </div>
      <div className="p-4">
        <div className="flex items-center gap-4 mb-3.5 pb-3.5 border-b divider">
          <Gauge value={q.overall} size={70} tone={tone} caption="Quality"/>
          <div className="min-w-0 flex-1">
            <div className="text-[14px] font-bold" style={{color:c(tone)}}>{q.band}</div>
            <div className="flex items-center gap-3 mt-1.5 flex-wrap">
              {[['Service',q.service+'%'],['Sales',q.sales===null?'n/a':q.sales+'%'],
                ['Compliance',q.compliance==='pass'?'Pass':'Breach']].map(([l,v])=>(
                <div key={l}>
                  <div className="text-[10px] t-muted uppercase tracking-wide font-bold">{l}</div>
                  <div className="text-[13px] font-bold"
                    style={{color:v==='Breach'?COLORS.red:'var(--text)'}}>{v}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
        <button onClick={()=>setOpen(!open)} className="w-full flex items-center justify-between gap-3 rounded-md px-3 py-2.5 mb-2.5"
          style={{background:'var(--surface-2)',border:'1px solid var(--border)'}}>
          <span className="text-[13px] font-semibold t-primary">{met} of {all.length} things done well</span>
          <span className="text-[12px] font-bold inline-flex items-center gap-1" style={{color:COLORS.accent}}>
            {open?'Hide the evidence':'Show the evidence'}
          </span>
        </button>
        {open&&q.sections.map(sec=>(
          <div key={sec.id} className="mb-2.5 fade-in">
            <div className="flex items-center justify-between mb-1">
              <span className="text-[10px] t-muted uppercase tracking-wide font-bold">{sec.name}</span>
              {sec.note&&<span className="text-[10px] t-muted">{sec.note}</span>}
            </div>
            {sec.criteria.map((cr,i)=>(
              <div key={i} className="flex items-start gap-2 py-1" style={{borderBottom:'1px dashed var(--border)'}}>
                <span className="w-3.5 h-3.5 rounded-full flex items-center justify-center text-[10px] font-bold shrink-0 mt-0.5"
                  style={{background:cr.pass?SOFT.green:SOFT.red,color:cr.pass?COLORS.green:COLORS.red}}>{cr.pass?'✓':'✕'}</span>
                <div className="min-w-0 flex-1">
                  <div className="text-[11.5px] font-semibold t-primary leading-tight">{cr.name}</div>
                  {cr.evidence&&(
                    <div className="text-[10.5px] t-muted leading-snug mt-0.5">
                      {cr.turn!==null&&cr.turn!==undefined&&<span className="mono font-bold mr-1">turn {cr.turn+1}</span>}
                      {cr.turn!==null&&cr.turn!==undefined?'“'+cr.evidence+'”':cr.evidence}
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        ))}
        <div className="p-2.5 rounded mt-3" style={{background:cs(tone)}}>
          <p className="text-[11.5px] font-semibold leading-snug" style={{color:c(tone)}}>{q.coaching_note}</p>
        </div>
        <p className="text-[10.5px] t-muted mt-2 leading-snug">
          Every call is scored like this. A supervisor listening by hand covers two or three calls per agent a month.
        </p>
      </div>
    </section>
  );
}
